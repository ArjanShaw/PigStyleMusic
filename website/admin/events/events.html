<!-- ==================== EVENTS TAB (ADMIN) ==================== -->
<div id="events-tab" class="tab-content">
    <h2><i class="fas fa-calendar-alt"></i> Manage Events</h2>
    <p class="text-muted">Create, edit, and delete events displayed on the public page.</p>

    <!-- Event Form -->
    <div class="user-form-section" style="background: linear-gradient(135deg, #6f42c1 0%, #e83e8c 100%);">
        <h3 style="margin-bottom: 20px;"><i class="fas fa-plus-circle"></i> <span id="event-form-title">Add New Event</span></h3>
        <input type="hidden" id="event-id" value="">
        <div class="user-form-grid">
            <div class="user-form-group">
                <label for="event-title">Title *</label>
                <input type="text" id="event-title" placeholder="e.g., Grand Opening Party">
            </div>
            <div class="user-form-group">
                <label for="event-date">Date & Time *</label>
                <input type="datetime-local" id="event-date">
            </div>
            <div class="user-form-group" style="grid-column: 1 / -1;">
                <label for="event-description">Description</label>
                <textarea id="event-description" rows="3" placeholder="Event details..." style="width:100%; padding:10px; border:1px solid rgba(255,255,255,0.2); border-radius:4px; background:rgba(255,255,255,0.95);"></textarea>
            </div>

            <!-- Image Upload -->
            <div class="user-form-group" style="grid-column: 1 / -1;">
                <label for="event-image-upload">Event Image</label>
                <input type="file" id="event-image-upload" accept="image/*" onchange="uploadEventImage(this)">
                <div id="event-image-preview" style="margin-top: 10px; display: none;">
                    <img id="event-image-preview-img" src="" alt="Preview" style="max-width: 150px; max-height: 150px; border-radius: 4px; border: 1px solid #ddd;">
                    <button type="button" class="btn btn-danger btn-small" onclick="removeEventImage()" style="margin-left: 10px;">Remove</button>
                </div>
                <input type="hidden" id="event-image-url" value="">
                <p style="font-size: 12px; color: rgba(255,255,255,0.8); margin-top: 5px;">Upload an image (JPG, PNG, GIF, WebP). Max 5MB.</p>
            </div>

            <!-- Recurring Fields -->
            <div class="user-form-group">
                <label for="event-repeat-type">Repeat Type</label>
                <select id="event-repeat-type">
                    <option value="none">None</option>
                    <option value="daily">Daily</option>
                    <option value="weekly">Weekly</option>
                    <option value="monthly">Monthly</option>
                    <option value="yearly">Yearly</option>
                </select>
            </div>
            <div class="user-form-group">
                <label for="event-repeat-interval">Interval</label>
                <input type="number" id="event-repeat-interval" min="1" value="1">
            </div>
            <div class="user-form-group">
                <label for="event-repeat-end-date">Repeat End Date</label>
                <input type="date" id="event-repeat-end-date">
            </div>
            <div class="user-form-group">
                <label for="event-repeat-day-of-week">Day of Week (0=Sun..6=Sat)</label>
                <input type="number" id="event-repeat-day-of-week" min="0" max="6" placeholder="e.g., 1 for Monday">
            </div>
            <div class="user-form-group">
                <label for="event-repeat-week-of-month">Week of Month (1-4)</label>
                <input type="number" id="event-repeat-week-of-month" min="1" max="4" placeholder="e.g., 2 for 2nd week">
            </div>
            <div class="user-form-group" style="grid-column: 1 / -1;">
                <label style="display:flex; align-items:center; gap:10px; cursor:pointer;">
                    <input type="checkbox" id="event-is-recurring">
                    <span>Recurring</span>
                </label>
            </div>
        </div>
        <div class="action-buttons" style="justify-content: flex-start;">
            <button class="btn btn-success" id="event-submit-btn" onclick="saveEvent()"><i class="fas fa-save"></i> Save Event</button>
            <button class="btn btn-secondary" onclick="clearEventForm()"><i class="fas fa-times"></i> Cancel</button>
        </div>
        <div id="event-form-status" class="status-message" style="display: none;"></div>
    </div>

    <!-- Events Table -->
    <div class="records-table-container">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; flex-wrap:wrap; gap:10px;">
            <h3 style="margin:0;"><i class="fas fa-list"></i> Upcoming Events</h3>
            <div style="display:flex; gap:10px;">
                <button class="btn btn-primary" onclick="loadEventsAdmin()"><i class="fas fa-sync-alt"></i> Refresh</button>
                <button class="btn btn-secondary" onclick="clearEventForm()"><i class="fas fa-plus"></i> New Event</button>
            </div>
        </div>
        <table class="records-table" id="events-admin-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Image</th>
                    <th>Title</th>
                    <th>Date</th>
                    <th>Description</th>
                    <th>RSVP</th>
                    <th>Recurring</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="events-admin-body">
                <tr><td colspan="8" style="text-align:center; padding:40px;"><i class="fas fa-spinner fa-spin"></i> Loading events...</td></tr>
            </tbody>
        </table>
    </div>
</div>
