<script>
// Navbar authentication handler
document.addEventListener('DOMContentLoaded', function() {
    checkAuthStatus();
});

function checkAuthStatus() {
    // Try to get auth status from localStorage first (fast)
    const cachedUser = localStorage.getItem('user');
    const cachedLoggedIn = localStorage.getItem('loggedIn');
    
    if (cachedLoggedIn === 'true' && cachedUser) {
        try {
            const user = JSON.parse(cachedUser);
            updateNavbar(user, true);
            return;
        } catch (e) {
            // Cache invalid, fetch fresh
        }
    }
    
    // Fetch fresh auth status
    fetch('/session/check', {
        credentials: 'include',
        headers: {
            'Accept': 'application/json'
        }
    })
    .then(response => {
        if (!response.ok) {
            throw new Error('Network response was not ok');
        }
        return response.json();
    })
    .then(data => {
        const isLoggedIn = data.logged_in === true;
        const user = data.user || null;
        
        // Cache the result
        if (isLoggedIn && user) {
            localStorage.setItem('loggedIn', 'true');
            localStorage.setItem('user', JSON.stringify(user));
        } else {
            localStorage.removeItem('loggedIn');
            localStorage.removeItem('user');
        }
        
        updateNavbar(user, isLoggedIn);
    })
    .catch(error => {
        console.error('Error checking auth status:', error);
        // Default to logged out
        updateNavbar(null, false);
    });
}

function updateNavbar(user, isLoggedIn) {
    const isAdmin = user && user.role === 'admin';
    
    // Dashboard - show if logged in
    const dashboardLink = document.getElementById('nav-dashboard-link');
    if (dashboardLink) {
        dashboardLink.style.display = isLoggedIn ? 'inline-flex' : 'none';
    }
    
    // Admin-only links
    const adminLinks = document.querySelectorAll('.admin-only');
    adminLinks.forEach(el => {
        el.style.display = (isLoggedIn && isAdmin) ? 'inline-flex' : 'none';
    });
    
    // User greeting
    const greeting = document.getElementById('nav-user-greeting');
    if (greeting) {
        if (isLoggedIn && user && user.full_name) {
            greeting.textContent = '👋 ' + user.full_name;
            greeting.style.display = 'inline';
        } else if (isLoggedIn && user && user.username) {
            greeting.textContent = '👋 ' + user.username;
            greeting.style.display = 'inline';
        } else {
            greeting.style.display = 'none';
        }
    }
    
    // Login/Logout links
    const loginLink = document.getElementById('nav-login-link');
    const logoutLink = document.getElementById('nav-logout-link');
    
    if (loginLink) {
        loginLink.style.display = isLoggedIn ? 'none' : 'inline-flex';
    }
    if (logoutLink) {
        logoutLink.style.display = isLoggedIn ? 'inline-flex' : 'none';
        if (isLoggedIn) {
            logoutLink.onclick = function(e) {
                e.preventDefault();
                logoutUser();
            };
        }
    }
    
    console.log('Navbar updated: loggedIn=' + isLoggedIn + ', isAdmin=' + isAdmin);
}

function logoutUser() {
    fetch('/logout', {
        method: 'POST',
        credentials: 'include',
        headers: {
            'Content-Type': 'application/json'
        }
    })
    .then(response => response.json())
    .then(data => {
        // Clear cached auth
        localStorage.removeItem('loggedIn');
        localStorage.removeItem('user');
        
        if (data.status === 'success') {
            window.location.href = '/';
        } else {
            window.location.href = '/';
        }
    })
    .catch(function(error) {
        console.error('Logout error:', error);
        localStorage.removeItem('loggedIn');
        localStorage.removeItem('user');
        window.location.href = '/';
    });
}

// Make functions globally available
window.logoutUser = logoutUser;
window.checkAuthStatus = checkAuthStatus;
</script>
