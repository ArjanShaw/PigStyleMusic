<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PigStyle Music</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav id="menu">
        <button onclick="showPage('home', this)" title="Home"><i class="fas fa-home"></i></button>
        <button onclick="showPage('shop', this)" title="Shop"><i class="fas fa-record-vinyl"></i></button>
        <button onclick="showPage('new', this)" title="New"><i class="fas fa-star"></i></button>
        <button onclick="showPage('merch', this)" title="Merch"><i class="fas fa-box-open"></i></button>
        <button onclick="showPage('events', this)" title="Events"><i class="fas fa-calendar-alt"></i></button>
        <button onclick="showPage('connect', this)" title="Connect"><i class="fas fa-envelope"></i></button>
        <button onclick="showPage('alerts', this)" title="Alerts"><i class="fas fa-bell"></i></button>
        <button onclick="showPage('order', this)" title="Order"><i class="fas fa-box"></i></button>
        <button onclick="showPage('cart', this)" title="Cart">
            <i class="fas fa-shopping-cart"></i>
            <span class="badge">2</span>
        </button>
        <button onclick="showPage('email', this)" title="Email"><i class="fas fa-paper-plane"></i></button>
        <button onclick="showPage('login', this)" class="login-btn" title="Login"><i class="fas fa-sign-in-alt"></i></button>
    </nav>
    <div id="content">
        <div id="page-content"></div>
    </div>
    <script src="/static/js/app.js"></script>
</body>
</html>
