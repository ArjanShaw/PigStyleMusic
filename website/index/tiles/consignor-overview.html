<div style="display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;height:100%;background:white;border-radius:16px;padding:24px;gap:18px;overflow-y:auto;width:100%;box-sizing:border-box;">

    <div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;">
        <div>
            <h2 style="color:#333;margin:0 0 4px 0;">📀 My Consignment</h2>
            <p id="coUser" style="color:#666;margin:0;font-size:14px;">Loading…</p>
        </div>
        <div id="coLastPayout" style="font-size:12px;color:#888;"></div>
    </div>

    <!-- Summary cards -->
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;">
        <div class="co-card" style="background:#f8f9fa;border-radius:12px;padding:16px;text-align:center;border:1px solid #eee;">
            <div style="font-size:22px;">🎵</div>
            <div style="font-size:12px;color:#666;margin-top:4px;">On Consignment</div>
            <div id="co-active-count" style="font-size:22px;font-weight:700;color:#333;">0</div>
            <div id="co-active-value" style="font-size:12px;color:#888;">$0.00 asking</div>
        </div>
        <div class="co-card" style="background:#f8f9fa;border-radius:12px;padding:16px;text-align:center;border:1px solid #eee;">
            <div style="font-size:22px;">✅</div>
            <div style="font-size:12px;color:#666;margin-top:4px;">Sold</div>
            <div id="co-sold-count" style="font-size:22px;font-weight:700;color:#333;">0</div>
            <div id="co-sold-gross" style="font-size:12px;color:#888;">$0.00 gross</div>
        </div>
        <div class="co-card" style="background:#f8f9fa;border-radius:12px;padding:16px;text-align:center;border:1px solid #eee;">
            <div style="font-size:22px;">💰</div>
            <div style="font-size:12px;color:#666;margin-top:4px;">Commission Earned</div>
            <div id="co-earned" style="font-size:22px;font-weight:700;color:#28a745;">$0.00</div>
            <div style="font-size:12px;color:#888;">your share</div>
        </div>
        <div class="co-card" style="background:#fff8f0;border-radius:12px;padding:16px;text-align:center;border:1px solid #ffe0b2;">
            <div style="font-size:22px;">🧾</div>
            <div style="font-size:12px;color:#666;margin-top:4px;">Owed to You</div>
            <div id="co-owed" style="font-size:22px;font-weight:700;color:#dc3545;">$0.00</div>
            <div id="co-paid" style="font-size:12px;color:#888;">$0.00 paid</div>
        </div>
    </div>

    <!-- Tabs -->
    <div style="display:flex;gap:6px;border-bottom:2px solid #eee;">
        <button class="co-tab co-tab-active" data-tab="active" style="padding:8px 16px;background:none;border:none;border-bottom:3px solid #6d4fc6;color:#6d4fc6;font-weight:600;cursor:pointer;font-size:14px;">On Consignment</button>
        <button class="co-tab" data-tab="sold" style="padding:8px 16px;background:none;border:none;border-bottom:3px solid transparent;color:#888;font-weight:600;cursor:pointer;font-size:14px;">Sold</button>
        <button class="co-tab" data-tab="payouts" style="padding:8px 16px;background:none;border:none;border-bottom:3px solid transparent;color:#888;font-weight:600;cursor:pointer;font-size:14px;">Payouts</button>
    </div>

    <div id="co-tab-content" style="flex:1;min-height:0;overflow-y:auto;"></div>

    <style>
        .co-tab.co-tab-active { border-bottom-color:#6d4fc6 !important; color:#6d4fc6 !important; }
        .co-row { display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid #f0f0f0;font-size:13px; }
        .co-row:last-child { border-bottom:none; }
        .co-row .co-title { font-weight:600;color:#333; }
        .co-row .co-sub { color:#999;font-size:11px; }
        .co-empty { text-align:center;padding:32px;color:#aaa;font-size:13px; }
    </style>
</div>
