<div style="display: flex; flex-direction: column; align-items: center; justify-content: flex-start; height: 100%; background: white; border-radius: 16px; padding: 20px; gap: 10px; overflow: hidden; width: 100%;">
    <h2 style="color: #333; margin: 0 0 5px 0;">💳 Checkout</h2>
    
    <!-- Search -->
    <div style="display: flex; gap: 10px; width: 100%;">
        <input type="text" id="checkout-search" placeholder="Search by artist or title..." style="flex: 1; padding: 10px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px;">
        <button onclick="checkoutSearch()" style="padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer;">
            <i class="fas fa-search"></i>
        </button>
        <button onclick="checkoutClear()" style="padding: 10px 20px; background: #6c757d; color: white; border: none; border-radius: 8px; cursor: pointer;">
            <i class="fas fa-times"></i>
        </button>
    </div>
    
    <!-- Cart Summary -->
    <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; background: #f8f9fa; padding: 10px 15px; border-radius: 8px;">
        <span style="font-weight: 600; color: #333;">🛒 Cart</span>
        <span style="color: #666;"><span id="checkout-cart-count">0</span> items</span>
        <span style="font-weight: bold; color: #28a745;">Total: <span id="checkout-cart-total">$0.00</span></span>
        <button onclick="checkoutProcess()" id="checkout-process-btn" disabled style="padding: 8px 20px; background: #28a745; color: white; border: none; border-radius: 30px; cursor: pointer; font-weight: 600;">
            Checkout
        </button>
    </div>
    
    <!-- Cart Items -->
    <div id="checkout-cart-items" style="width: 100%; flex: 1; overflow-y: auto; padding: 5px 0;">
        <div style="text-align: center; padding: 20px; color: #999;">Cart is empty</div>
    </div>
    
    <!-- Search Results -->
    <div id="checkout-results" style="width: 100%; flex: 2; overflow-y: auto; padding: 5px 0;">
        <div style="text-align: center; padding: 20px; color: #999;">Search for records to add</div>
    </div>
</div>
