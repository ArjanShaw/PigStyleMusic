<div style="display: flex; flex-direction: column; align-items: center; justify-content: flex-start; height: 100%; background: white; border-radius: 16px; padding: 20px; gap: 10px; overflow: hidden; width: 100%;">
    <h2 style="color: #333; margin: 0 0 5px 0;">📦 Record Orders</h2>
    <p style="color: #666; margin: 0 0 10px 0;">Manage customer vinyl requests</p>
    
    <!-- Stats -->
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; width: 100%;">
        <div style="background: #f8f9fa; border-radius: 8px; padding: 10px; text-align: center; border: 1px solid #eee;">
            <div style="font-size: 20px; color: #007bff;" id="ro-total">0</div>
            <div style="font-size: 10px; color: #666;">Total</div>
        </div>
        <div style="background: #f8f9fa; border-radius: 8px; padding: 10px; text-align: center; border: 1px solid #eee;">
            <div style="font-size: 20px; color: #ffc107;" id="ro-pending">0</div>
            <div style="font-size: 10px; color: #666;">Pending</div>
        </div>
        <div style="background: #f8f9fa; border-radius: 8px; padding: 10px; text-align: center; border: 1px solid #eee;">
            <div style="font-size: 20px; color: #28a745;" id="ro-completed">0</div>
            <div style="font-size: 10px; color: #666;">Completed</div>
        </div>
        <div style="background: #f8f9fa; border-radius: 8px; padding: 10px; text-align: center; border: 1px solid #eee;">
            <div style="font-size: 20px; color: #dc3545;" id="ro-cancelled">0</div>
            <div style="font-size: 10px; color: #666;">Cancelled</div>
        </div>
        <div style="background: #f8f9fa; border-radius: 8px; padding: 10px; text-align: center; border: 1px solid #eee;">
            <div style="font-size: 20px; color: #17a2b8;" id="ro-unread">0</div>
            <div style="font-size: 10px; color: #666;">New</div>
        </div>
    </div>
    
    <!-- Actions -->
    <div style="display: flex; gap: 8px; width: 100%; flex-wrap: wrap;">
        <button onclick="roRefresh()" style="padding: 8px 16px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600;">
            <i class="fas fa-sync"></i> Refresh
        </button>
        <button onclick="roMarkAllRead()" style="padding: 8px 16px; background: #17a2b8; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600;">
            <i class="fas fa-check-double"></i> Mark All Read
        </button>
        <button onclick="roExportCSV()" style="padding: 8px 16px; background: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600;">
            <i class="fas fa-file-csv"></i> Export CSV
        </button>
    </div>
    
    <!-- Search/Filter -->
    <div style="display: flex; gap: 10px; width: 100%; flex-wrap: wrap;">
        <input type="text" id="ro-search" placeholder="Search by order #, customer, email, phone..." style="flex: 1; min-width: 150px; padding: 10px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px;">
        <select id="ro-status-filter" style="padding: 10px; border: 2px solid #ddd; border-radius: 8px;">
            <option value="all">All Status</option>
            <option value="pending">Pending</option>
            <option value="confirmed">Confirmed</option>
            <option value="processing">Processing</option>
            <option value="shipped">Shipped</option>
            <option value="completed">Completed</option>
            <option value="cancelled">Cancelled</option>
        </select>
        <select id="ro-read-filter" style="padding: 10px; border: 2px solid #ddd; border-radius: 8px;">
            <option value="all">All Read Status</option>
            <option value="unread">Unread</option>
            <option value="read">Read</option>
        </select>
        <button onclick="roApplyFilters()" style="padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer;">
            <i class="fas fa-search"></i> Apply
        </button>
        <button onclick="roClearFilters()" style="padding: 10px 20px; background: #6c757d; color: white; border: none; border-radius: 8px; cursor: pointer;">
            <i class="fas fa-times"></i> Clear
        </button>
    </div>
    
    <!-- Orders Table -->
    <div style="width: 100%; flex: 1; overflow-y: auto; border: 1px solid #eee; border-radius: 8px; padding: 5px;">
        <div id="ro-list" style="width: 100%;">
            <div style="text-align: center; padding: 40px; color: #999;">Loading orders...</div>
        </div>
    </div>
</div>

<!-- View Order Modal -->
<div id="ro-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 10001; align-items: center; justify-content: center;">
    <div style="background: white; border-radius: 16px; max-width: 600px; width: 95%; max-height: 90vh; overflow-y: auto; padding: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);">
        <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 20px;">
            <h2 id="ro-modal-title" style="margin: 0; color: #333; font-size: 20px;">Order Details</h2>
            <button onclick="roCloseModal()" style="background: none; border: none; font-size: 28px; cursor: pointer; color: #999; padding: 0 8px;">&times;</button>
        </div>
        <input type="hidden" id="ro-view-id">
        
        <div id="ro-modal-body">
            <div style="text-align: center; padding: 20px; color: #888;">Loading...</div>
        </div>
        
        <div id="ro-modal-status" style="margin-top: 10px; display: none; padding: 10px; border-radius: 8px; font-size: 13px;"></div>
        <div style="display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end;">
            <button onclick="roCloseModal()" style="padding: 10px 20px; background: #6c757d; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;">Close</button>
            <button onclick="roUpdateStatus()" id="ro-update-btn" style="padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;">
                <i class="fas fa-save"></i> Update Status
            </button>
        </div>
    </div>
</div>
