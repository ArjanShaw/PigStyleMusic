<!-- Tile 4: Connect -->
<div class="tile" data-index="4">
    <div class="flip-card" id="flipCard4">
        <div class="flip-card-front connect-front">
            <span class="flip-hint"><i class="fas fa-rotate"></i> Tap to flip</span>
        </div>
        <div class="flip-card-back" style="padding:0; display:flex; align-items:center; justify-content:center; background:transparent; width:100%; height:100%;">
            <div style="width:100%; max-width:500px; height:100%; max-height:800px; aspect-ratio:9/16; display:flex; align-items:center; justify-content:center; padding:10px; box-sizing:border-box;">
                <div class="connect-container" style="width:100%; height:100%; overflow-y:auto; padding:0; margin:0;">
                    <div class="connect-feedback-card" style="width:100%; height:100%; max-width:100%; margin:0; display:flex; flex-direction:column; justify-content:center; background:white; border-radius:20px; padding:25px; box-sizing:border-box; box-shadow:0 4px 30px rgba(0,0,0,0.15);">
                        <h3 style="color:#333; font-size:18px; font-weight:600; margin-bottom:15px; border-bottom:2px solid #ff6b6b; padding-bottom:8px; display:inline-block; text-align:center; width:100%;">
                            <i class="fas fa-comments" style="color:#ff6b6b; margin-right:8px;"></i> Send Us a Message
                        </h3>
                        <form id="connectForm" class="connect-feedback-form" style="display:flex; flex-direction:column; gap:12px; flex:1;">
                            <div class="form-group" style="display:flex; flex-direction:column; gap:4px;">
                                <label style="color:#666; font-size:12px; font-weight:500;">Name <span class="optional" style="color:#999; font-weight:normal; font-size:11px;">(optional)</span></label>
                                <input type="text" id="connectName" placeholder="Your name" style="padding:8px 12px; border-radius:6px; border:2px solid #ddd; background:white; color:#333; font-size:13px; outline:none; font-family:inherit;">
                            </div>
                            <div class="form-group" style="display:flex; flex-direction:column; gap:4px;">
                                <label style="color:#666; font-size:12px; font-weight:500;">Contact Info <span class="optional" style="color:#999; font-weight:normal; font-size:11px;">(optional)</span></label>
                                <input type="text" id="connectContact" placeholder="Email or phone number" style="padding:8px 12px; border-radius:6px; border:2px solid #ddd; background:white; color:#333; font-size:13px; outline:none; font-family:inherit;">
                            </div>
                            <div class="form-group" style="display:flex; flex-direction:column; gap:4px; flex:1;">
                                <label style="color:#666; font-size:12px; font-weight:500;">Your Message <span class="required" style="color:#ff6b6b;">*</span></label>
                                <textarea id="connectFeedback" placeholder="Tell us what you think. Suggestions for events, music, store improvements, or just say hello." style="padding:8px 12px; border-radius:6px; border:2px solid #ddd; background:white; color:#333; font-size:13px; outline:none; font-family:inherit; resize:vertical; min-height:80px; flex:1;"></textarea>
                            </div>
                            <button type="submit" class="connect-submit-btn" style="padding:10px; background:#ff6b6b; color:white; border:none; border-radius:30px; font-size:14px; font-weight:600; cursor:pointer; transition:all 0.2s; margin-top:5px;">Send Message</button>
                            <div id="connectMessage" class="connect-message" style="padding:10px; border-radius:6px; margin-top:10px; display:none; font-size:13px; text-align:center;"></div>
                        </form>
                    </div>
                </div>
            </div>
            <span class="flip-hint"><i class="fas fa-rotate"></i> Tap to flip back</span>
        </div>
    </div>
</div>
