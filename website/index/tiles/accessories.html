<div style="display: flex; flex-direction: column; align-items: center; justify-content: flex-start; height: 100%; background: white; border-radius: 16px; padding: 20px; gap: 10px; overflow: hidden; width: 100%;">
    <h2 style="color: #333; margin: 0 0 5px 0;">👕 Accessories</h2>
    <p style="color: #666; margin: 0 0 10px 0;">Manage merchandise and accessories</p>
    
    <!-- Stats -->
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; width: 100%;">
        <div style="background: #f8f9fa; border-radius: 8px; padding: 10px; text-align: center; border: 1px solid #eee;">
            <div style="font-size: 20px; color: #007bff;" id="acc-total">0</div>
            <div style="font-size: 11px; color: #666;">Total Items</div>
        </div>
        <div style="background: #f8f9fa; border-radius: 8px; padding: 10px; text-align: center; border: 1px solid #eee;">
            <div style="font-size: 20px; color: #28a745;" id="acc-active">0</div>
            <div style="font-size: 11px; color: #666;">Active</div>
        </div>
        <div style="background: #f8f9fa; border-radius: 8px; padding: 10px; text-align: center; border: 1px solid #eee;">
            <div style="font-size: 20px; color: #ffc107;" id="acc-inactive">0</div>
            <div style="font-size: 11px; color: #666;">Inactive</div>
        </div>
        <div style="background: #f8f9fa; border-radius: 8px; padding: 10px; text-align: center; border: 1px solid #eee;">
            <div style="font-size: 20px; color: #17a2b8;" id="acc-avg-price">$0.00</div>
            <div style="font-size: 11px; color: #666;">Avg Price</div>
        </div>
    </div>
    
    <!-- Actions -->
    <div style="display: flex; gap: 8px; width: 100%; flex-wrap: wrap;">
        <button onclick="accShowAdd()" style="padding: 8px 16px; background: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600;">
            <i class="fas fa-plus"></i> Add Accessory
        </button>
        <button onclick="accRefresh()" style="padding: 8px 16px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600;">
            <i class="fas fa-sync"></i> Refresh
        </button>
    </div>
    
    <!-- Search -->
    <div style="display: flex; gap: 10px; width: 100%;">
        <input type="text" id="acc-search" placeholder="Search by title or description..." style="flex: 1; padding: 10px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px;">
        <button onclick="accSearch()" style="padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer;">
            <i class="fas fa-search"></i>
        </button>
        <button onclick="accClear()" style="padding: 10px 20px; background: #6c757d; color: white; border: none; border-radius: 8px; cursor: pointer;">
            <i class="fas fa-times"></i>
        </button>
    </div>
    
    <!-- Accessories Table -->
    <div style="width: 100%; flex: 1; overflow-y: auto; border: 1px solid #eee; border-radius: 8px; padding: 5px;">
        <div id="acc-list" style="width: 100%;">
            <div style="text-align: center; padding: 40px; color: #999;">Loading accessories...</div>
        </div>
    </div>
</div>

<!-- Add/Edit Accessory Modal -->
<div id="acc-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 10001; align-items: center; justify-content: center;">
    <div style="background: white; border-radius: 16px; max-width: 500px; width: 95%; max-height: 90vh; overflow-y: auto; padding: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);">
        <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 20px;">
            <h2 id="acc-modal-title" style="margin: 0; color: #333; font-size: 20px;">Add Accessory</h2>
            <button onclick="accCloseModal()" style="background: none; border: none; font-size: 28px; cursor: pointer; color: #999; padding: 0 8px;">&times;</button>
        </div>
        <input type="hidden" id="acc-edit-id">
        
        <div style="margin-bottom: 12px;">
            <label style="display: block; font-weight: 600; color: #555; font-size: 13px; margin-bottom: 4px;">Title *</label>
            <input type="text" id="acc-title" placeholder="e.g., PigStyle T-Shirt - Black" style="width: 100%; padding: 8px; border: 2px solid #ddd; border-radius: 8px;">
        </div>
        <div style="margin-bottom: 12px;">
            <label style="display: block; font-weight: 600; color: #555; font-size: 13px; margin-bottom: 4px;">Price ($) *</label>
            <input type="number" id="acc-price" step="0.01" min="0" placeholder="24.99" style="width: 100%; padding: 8px; border: 2px solid #ddd; border-radius: 8px;">
        </div>
        <div style="margin-bottom: 12px;">
            <label style="display: block; font-weight: 600; color: #555; font-size: 13px; margin-bottom: 4px;">Description</label>
            <textarea id="acc-description" rows="3" placeholder="Detailed description..." style="width: 100%; padding: 8px; border: 2px solid #ddd; border-radius: 8px;"></textarea>
        </div>
        <div style="margin-bottom: 12px;">
            <label style="display: block; font-weight: 600; color: #555; font-size: 13px; margin-bottom: 4px;">Image URL</label>
            <input type="text" id="acc-image" placeholder="/static/images/merch/item.jpg" style="width: 100%; padding: 8px; border: 2px solid #ddd; border-radius: 8px;">
        </div>
        <div style="margin-bottom: 12px;">
            <label style="display: block; font-weight: 600; color: #555; font-size: 13px; margin-bottom: 4px;">Status</label>
            <select id="acc-status" style="width: 100%; padding: 8px; border: 2px solid #ddd; border-radius: 8px;">
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
            </select>
        </div>
        
        <div id="acc-modal-status" style="margin-top: 10px; display: none; padding: 10px; border-radius: 8px; font-size: 13px;"></div>
        <div style="display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end;">
            <button onclick="accCloseModal()" style="padding: 10px 20px; background: #6c757d; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;">Cancel</button>
            <button onclick="accSave()" id="acc-save-btn" style="padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;">
                <i class="fas fa-save"></i> Save
            </button>
        </div>
    </div>
</div>
