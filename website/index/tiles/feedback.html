<div style="display: flex; flex-direction: column; align-items: center; justify-content: flex-start; height: 100%; background: white; border-radius: 16px; padding: 20px; gap: 10px; overflow: hidden; width: 100%;">
    <h2 style="color: #333; margin: 0 0 5px 0;">💬 Feedback</h2>
    <p style="color: #666; margin: 0 0 10px 0;">Manage customer feedback and suggestions</p>
    
    <!-- Stats -->
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; width: 100%;">
        <div style="background: #f8f9fa; border-radius: 8px; padding: 10px; text-align: center; border: 1px solid #eee;">
            <div style="font-size: 20px; color: #007bff;" id="fb-total">0</div>
            <div style="font-size: 10px; color: #666;">Total</div>
        </div>
        <div style="background: #f8f9fa; border-radius: 8px; padding: 10px; text-align: center; border: 1px solid #eee;">
            <div style="font-size: 20px; color: #ffc107;" id="fb-new">0</div>
            <div style="font-size: 10px; color: #666;">New</div>
        </div>
        <div style="background: #f8f9fa; border-radius: 8px; padding: 10px; text-align: center; border: 1px solid #eee;">
            <div style="font-size: 20px; color: #17a2b8;" id="fb-read">0</div>
            <div style="font-size: 10px; color: #666;">Read</div>
        </div>
        <div style="background: #f8f9fa; border-radius: 8px; padding: 10px; text-align: center; border: 1px solid #eee;">
            <div style="font-size: 20px; color: #28a745;" id="fb-responded">0</div>
            <div style="font-size: 10px; color: #666;">Responded</div>
        </div>
        <div style="background: #f8f9fa; border-radius: 8px; padding: 10px; text-align: center; border: 1px solid #eee;">
            <div style="font-size: 20px; color: #dc3545;" id="fb-archived">0</div>
            <div style="font-size: 10px; color: #666;">Archived</div>
        </div>
    </div>
    
    <!-- Actions -->
    <div style="display: flex; gap: 8px; width: 100%; flex-wrap: wrap;">
        <button onclick="fbRefresh()" style="padding: 8px 16px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600;">
            <i class="fas fa-sync"></i> Refresh
        </button>
        <button onclick="fbMarkAllRead()" style="padding: 8px 16px; background: #17a2b8; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600;">
            <i class="fas fa-check-double"></i> Mark All Read
        </button>
        <button onclick="fbExportCSV()" style="padding: 8px 16px; background: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600;">
            <i class="fas fa-file-csv"></i> Export CSV
        </button>
    </div>
    
    <!-- Search/Filter -->
    <div style="display: flex; gap: 10px; width: 100%; flex-wrap: wrap;">
        <input type="text" id="fb-search" placeholder="Search content or contact info..." style="flex: 1; min-width: 150px; padding: 10px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px;">
        <select id="fb-status-filter" style="padding: 10px; border: 2px solid #ddd; border-radius: 8px;">
            <option value="all">All Status</option>
            <option value="new">New</option>
            <option value="read">Read</option>
            <option value="responded">Responded</option>
            <option value="archived">Archived</option>
        </select>
        <select id="fb-type-filter" style="padding: 10px; border: 2px solid #ddd; border-radius: 8px;">
            <option value="all">All Types</option>
            <option value="general">General</option>
            <option value="event">Event</option>
            <option value="suggestion">Suggestion</option>
            <option value="complaint">Complaint</option>
        </select>
        <button onclick="fbApplyFilters()" style="padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer;">
            <i class="fas fa-search"></i> Apply
        </button>
        <button onclick="fbClearFilters()" style="padding: 10px 20px; background: #6c757d; color: white; border: none; border-radius: 8px; cursor: pointer;">
            <i class="fas fa-times"></i> Clear
        </button>
    </div>
    
    <!-- Feedback Table -->
    <div style="width: 100%; flex: 1; overflow-y: auto; border: 1px solid #eee; border-radius: 8px; padding: 5px;">
        <div id="fb-list" style="width: 100%;">
            <div style="text-align: center; padding: 40px; color: #999;">Loading feedback...</div>
        </div>
    </div>
</div>

<!-- View Feedback Modal -->
<div id="fb-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 10001; align-items: center; justify-content: center;">
    <div style="background: white; border-radius: 16px; max-width: 600px; width: 95%; max-height: 90vh; overflow-y: auto; padding: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);">
        <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 20px;">
            <h2 id="fb-modal-title" style="margin: 0; color: #333; font-size: 20px;">Feedback Details</h2>
            <button onclick="fbCloseModal()" style="background: none; border: none; font-size: 28px; cursor: pointer; color: #999; padding: 0 8px;">&times;</button>
        </div>
        <input type="hidden" id="fb-view-id">
        
        <div id="fb-modal-body">
            <div style="text-align: center; padding: 20px; color: #888;">Loading...</div>
        </div>
        
        <div id="fb-modal-status" style="margin-top: 10px; display: none; padding: 10px; border-radius: 8px; font-size: 13px;"></div>
        <div style="display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end;">
            <button onclick="fbCloseModal()" style="padding: 10px 20px; background: #6c757d; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;">Close</button>
            <button onclick="fbUpdateStatus()" id="fb-update-btn" style="padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;">
                <i class="fas fa-save"></i> Update Status
            </button>
        </div>
    </div>
</div>
