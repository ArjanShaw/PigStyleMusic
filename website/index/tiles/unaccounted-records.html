<div style="display: flex; flex-direction: column; align-items: stretch; height: 100%; background: white; border-radius: 16px; padding: 20px; gap: 12px; overflow: hidden; width: 100%; box-sizing: border-box;"
     data-root-id="241">

    <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;">
        <div>
            <h2 style="color: #333; margin: 0;">🔍 Unaccounted Records</h2>
            <p style="color: #666; margin: 4px 0 0 0; font-size: 13px;" id="ur-scope-label">
                Records in the tracked location subtree that were present at the last scan but not seen in the newest pass.
            </p>
        </div>
        <button onclick="urRefresh()"
                style="padding: 8px 18px; background: #28a745; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600;">
            <i class="fas fa-sync"></i> Refresh
        </button>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; width: 100%;">
        <div style="background: #f8f9fa; border-radius: 8px; padding: 10px; text-align: center; border: 1px solid #eee;">
            <div style="font-size: 20px; color: #333;" id="ur-total-active">0</div>
            <div style="font-size: 10px; color: #666;">Active in subtree</div>
        </div>
        <div style="background: #f8f9fa; border-radius: 8px; padding: 10px; text-align: center; border: 1px solid #eee;">
            <div style="font-size: 20px; color: #dc3545;" id="ur-total-unaccounted">0</div>
            <div style="font-size: 10px; color: #666;">Unaccounted</div>
        </div>
        <div style="background: #f8f9fa; border-radius: 8px; padding: 10px; text-align: center; border: 1px solid #eee;">
            <div style="font-size: 20px; color: #fd7e14;" id="ur-total-missing">0</div>
            <div style="font-size: 10px; color: #666;">Flagged missing</div>
        </div>
        <div style="background: #f8f9fa; border-radius: 8px; padding: 10px; text-align: center; border: 1px solid #eee;">
            <div style="font-size: 20px; color: #6f42c1;" id="ur-total-reorder">0</div>
            <div style="font-size: 10px; color: #666;">To reorder</div>
        </div>
        <div style="background: #f8f9fa; border-radius: 8px; padding: 10px; text-align: center; border: 1px solid #eee;">
            <div style="font-size: 20px; color: #007bff;" id="ur-scan-date">—</div>
            <div style="font-size: 10px; color: #666;">Scan date</div>
        </div>
    </div>

    <div style="display: flex; gap: 8px; width: 100%; flex-wrap: wrap; align-items: center;">
        <div style="display: flex; gap: 0; border: 1px solid #ddd; border-radius: 6px; overflow: hidden;">
            <button id="ur-tab-all" onclick="urSetView('all')"
                    style="padding: 8px 16px; border: none; background: #007bff; color: white; cursor: pointer; font-size: 13px; font-weight: 600;">
                All
            </button>
            <button id="ur-tab-unaccounted" onclick="urSetView('unaccounted')"
                    style="padding: 8px 16px; border: none; background: white; color: #333; cursor: pointer; font-size: 13px; font-weight: 600; border-left: 1px solid #ddd;">
                Unaccounted
            </button>
            <button id="ur-tab-missing" onclick="urSetView('missing')"
                    style="padding: 8px 16px; border: none; background: white; color: #333; cursor: pointer; font-size: 13px; font-weight: 600; border-left: 1px solid #ddd;">
                Missing
            </button>
            <button id="ur-tab-reorder" onclick="urSetView('reorder')"
                    style="padding: 8px 16px; border: none; background: white; color: #333; cursor: pointer; font-size: 13px; font-weight: 600; border-left: 1px solid #ddd;">
                Reorder
            </button>
        </div>
        <input type="text" id="ur-search" placeholder="Search by artist, title, or ID..."
               style="flex: 1; min-width: 180px; padding: 8px; border: 2px solid #ddd; border-radius: 6px; font-size: 13px;">
        <button onclick="urSearch()" style="padding: 6px 14px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer;"><i class="fas fa-search"></i></button>
        <button onclick="urClearSearch()" style="padding: 6px 14px; background: #6c757d; color: white; border: none; border-radius: 6px; cursor: pointer;"><i class="fas fa-times"></i></button>
    </div>

    <div id="ur-list" style="flex: 1; overflow-y: auto; border: 1px solid #eee; border-radius: 8px; padding: 5px; width: 100%;">
        <div style="text-align: center; padding: 20px; color: #999;">Loading…</div>
    </div>
</div>
