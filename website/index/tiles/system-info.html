<div style="display: flex; flex-direction: column; align-items: center; justify-content: flex-start; height: 100%; background: white; border-radius: 16px; padding: 20px; gap: 10px; overflow: hidden; width: 100%;">
    <h2 style="color: #333; margin: 0 0 5px 0;">ℹ️ System Info</h2>
    <p style="color: #666; margin: 0 0 10px 0;">View system configuration information</p>
    
    <!-- System Stats -->
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; width: 100%;">
        <div style="background: #f8f9fa; border-radius: 8px; padding: 10px; text-align: center; border: 1px solid #eee;">
            <div style="font-size: 20px; color: #007bff;" id="si-total-configs">0</div>
            <div style="font-size: 10px; color: #666;">Total Configs</div>
        </div>
        <div style="background: #f8f9fa; border-radius: 8px; padding: 10px; text-align: center; border: 1px solid #eee;">
            <div style="font-size: 20px; color: #28a745;" id="si-print-configs">0</div>
            <div style="font-size: 10px; color: #666;">Print Settings</div>
        </div>
        <div style="background: #f8f9fa; border-radius: 8px; padding: 10px; text-align: center; border: 1px solid #eee;">
            <div style="font-size: 20px; color: #ffc107;" id="si-store-configs">0</div>
            <div style="font-size: 10px; color: #666;">Store Settings</div>
        </div>
        <div style="background: #f8f9fa; border-radius: 8px; padding: 10px; text-align: center; border: 1px solid #eee;">
            <div style="font-size: 20px; color: #17a2b8;" id="si-other-configs">0</div>
            <div style="font-size: 10px; color: #666;">Other Configs</div>
        </div>
    </div>
    
    <!-- All Configs Table -->
    <div style="width: 100%; flex: 1; overflow-y: auto; border: 1px solid #eee; border-radius: 8px; padding: 5px;">
        <div id="si-list" style="width: 100%;">
            <div style="text-align: center; padding: 40px; color: #999;">Loading system info...</div>
        </div>
    </div>
    
    <!-- Actions -->
    <div style="display: flex; gap: 8px; width: 100%; flex-wrap: wrap;">
        <button onclick="siRefresh()" style="padding: 8px 16px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600;">
            <i class="fas fa-sync"></i> Refresh
        </button>
        <button onclick="siExport()" style="padding: 8px 16px; background: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600;">
            <i class="fas fa-download"></i> Export CSV
        </button>
    </div>
</div>
