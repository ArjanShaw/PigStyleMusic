<div style="display: flex; flex-direction: column; align-items: center; justify-content: flex-start; height: 100%; background: white; border-radius: 16px; padding: 20px; gap: 10px; overflow: hidden; width: 100%;">
    <h2 style="color: #333; margin: 0 0 5px 0;">📤 Post to Discogs</h2>
    
    <!-- Markup Controls -->
    <div style="width: 100%; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; background: #f8f9fa; padding: 10px 15px; border-radius: 8px; border: 1px solid #e9ecef;">
        <div style="display: flex; align-items: center; gap: 8px;">
            <label style="font-size: 13px; font-weight: 600; color: #333; white-space: nowrap;">Initial Markup:</label>
            <input type="number" id="discogs-markup-percent" value="20" min="-100" max="200" step="1" 
                   style="width: 60px; padding: 4px 6px; border: 1px solid #ced4da; border-radius: 4px; font-size: 13px; text-align: center;">
            <span style="font-size: 13px; color: #666;">%</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
            <label style="font-size: 13px; font-weight: 600; color: #333; white-space: nowrap;">Weekly Step:</label>
            <input type="number" id="discogs-price-step" value="2" min="0" max="50" step="0.5" 
                   style="width: 60px; padding: 4px 6px; border: 1px solid #ced4da; border-radius: 4px; font-size: 13px; text-align: center;">
            <span style="font-size: 13px; color: #666;">%/wk</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
            <label style="font-size: 13px; font-weight: 600; color: #333; white-space: nowrap;">Min Markdown:</label>
            <input type="number" id="discogs-min-markdown" value="-50" min="-100" max="0" step="1" 
                   style="width: 60px; padding: 4px 6px; border: 1px solid #ced4da; border-radius: 4px; font-size: 13px; text-align: center;">
            <span style="font-size: 13px; color: #666;">% (floor)</span>
        </div>
        <button onclick="updateDiscogsPrices()" style="padding: 5px 16px; background: #667eea; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600;">
            🔄 Update Prices
        </button>
        <span id="price-calc-info" style="font-size: 12px; color: #888; margin-left: auto;">
            Ready
        </span>
    </div>
    
    <!-- Status -->
    <div id="post-discogs-status" style="width: 100%; display: none; padding: 8px 12px; border-radius: 8px; font-size: 13px;"></div>
    
    <!-- Records Table -->
    <div style="width: 100%; flex: 1; overflow-y: auto; border: 1px solid #eee; border-radius: 8px; padding: 5px;">
        <div id="post-discogs-records" style="width: 100%;">
            <div style="text-align: center; padding: 20px; color: #999;">Loading records...</div>
        </div>
    </div>
    
    <!-- Post ALL Button -->
    <button onclick="postDiscogsAll()" id="post-discogs-btn" disabled style="padding: 10px 30px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 30px; cursor: pointer; font-size: 14px; font-weight: 600;">
        <i class="fas fa-share-alt"></i> Post All Records to Discogs
    </button> 
</div>
