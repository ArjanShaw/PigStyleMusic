<!-- ================================================================ -->
<!-- FILE: /tiles/locations-admin.html                                -->
<!-- Locations admin - tree view, add child, clear records, delete.   -->
<!-- Also: select any node, edit pricing markup, and post its subtree -->
<!-- to eBay or Discogs, with a cancel button to stop a running post. -->
<!-- ================================================================ -->

<div style="display: flex; flex-direction: column; height: 100%; background: white; border-radius: 16px; padding: 20px; gap: 12px; overflow: hidden; width: 100%; box-sizing: border-box;">

    <div style="display: flex; justify-content: space-between; align-items: center;">
        <div>
            <h2 style="color: #333; margin: 0;">🗺️ Locations</h2>
            <p style="color: #666; margin: 4px 0 0 0; font-size: 13px;">
                Manage the location hierarchy (bins, sub-slots, areas). Select any level and post its subtree.
            </p>
        </div>
        <div style="display: flex; gap: 8px;">
            <button onclick="locationsAdminAddRoot()"
                    style="padding: 8px 18px; background: #28a745; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600;">
                <i class="fas fa-plus"></i> Add Root Location
            </button>
            <button onclick="locationsAdminRefresh()"
                    style="padding: 8px 18px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600;">
                <i class="fas fa-sync"></i> Refresh
            </button>
        </div>
    </div>

    <!-- Pricing / Markup Controls -->
    <div style="width: 100%; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; background: #f8f9fa; padding: 10px 15px; border-radius: 8px; border: 1px solid #e9ecef;">
        <div style="display: flex; align-items: center; gap: 8px;">
            <label style="font-size: 13px; font-weight: 600; color: #333; white-space: nowrap;">Initial Markup:</label>
            <input type="number" id="locations-pricing-markup" min="-100" max="200" step="1"
                   style="width: 60px; padding: 4px 6px; border: 1px solid #ced4da; border-radius: 4px; font-size: 13px; text-align: center;">
            <span style="font-size: 13px; color: #666;">%</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
            <label style="font-size: 13px; font-weight: 600; color: #333; white-space: nowrap;">Weekly Step:</label>
            <input type="number" id="locations-pricing-step" min="0" max="50" step="0.5"
                   style="width: 60px; padding: 4px 6px; border: 1px solid #ced4da; border-radius: 4px; font-size: 13px; text-align: center;">
            <span style="font-size: 13px; color: #666;">%/wk</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
            <label style="font-size: 13px; font-weight: 600; color: #333; white-space: nowrap;">Max Markdown:</label>
            <input type="number" id="locations-pricing-max-markdown" min="0" max="100" step="1"
                   style="width: 60px; padding: 4px 6px; border: 1px solid #ced4da; border-radius: 4px; font-size: 13px; text-align: center;">
            <span style="font-size: 13px; color: #666;">% (max discount)</span>
        </div>
        <button id="locations-pricing-update-btn"
                onclick="locationsUpdatePricing()"
                style="padding: 5px 16px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600;">
            🔄 Update Pricing
        </button>
        <span id="locations-pricing-info" style="font-size: 12px; color: #888; margin-left: auto;">
            Ready
        </span>
    </div>

    <!-- Selection / Post row -->
    <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 14px; background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px;">
        <span id="locations-admin-selection-info" style="font-size: 13px; color: #666; flex: 1;">
            No locations selected
        </span>
        <button id="locations-admin-post-ebay"
                onclick="locationsAdminPostEbay()"
                disabled
                style="padding: 6px 20px; background: linear-gradient(135deg, #0064d2 0%, #004a99 100%); color: white; border: none; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: 600; opacity: 0.5;">
            🛒 Post Selected to eBay
        </button>
        <button id="locations-admin-post-discogs"
                onclick="locationsAdminPostDiscogs()"
                disabled
                style="padding: 6px 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: 600; opacity: 0.5;">
            📀 Post Selected to Discogs
        </button>
        <button id="locations-admin-clear-selection"
                onclick="locationsAdminClearSelection()"
                disabled
                style="padding: 6px 16px; background: #6c757d; color: white; border: none; border-radius: 20px; cursor: pointer; font-size: 12px; font-weight: 600; opacity: 0.5;">
            Clear Selection
        </button>
        <button id="locations-admin-cancel-post"
                onclick="locationsAdminCancelPost()"
                style="display: none; padding: 6px 20px; background: #dc3545; color: white; border: none; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: 600;">
            ⏹️ Cancel Posting
        </button>
    </div>

    <div id="locations-admin-status"
         style="display: none; padding: 10px 14px; border-radius: 8px; font-size: 13px; box-sizing: border-box;"></div>

    <div style="flex: 1; overflow-y: auto; border: 1px solid #eee; border-radius: 8px; padding: 10px;">
        <div id="locations-admin-tree">
            <div style="text-align: center; padding: 30px; color: #999; font-size: 13px;">
                Loading locations...
            </div>
        </div>
    </div>

    <div style="display: flex; gap: 12px; font-size: 12px; color: #999; padding-top: 6px; border-top: 1px solid #eee;">
        <span>Total: <strong id="locations-admin-count" style="color: #333;">0</strong></span>
        <span>Roots: <strong id="locations-admin-roots" style="color: #333;">0</strong></span>
        <span>Leaves: <strong id="locations-admin-leaves" style="color: #333;">0</strong></span>
    </div>

</div>
