<div style="display: flex; flex-direction: column; align-items: center; justify-content: flex-start; height: 100%; background: white; border-radius: 16px; padding: 20px; gap: 10px; overflow: hidden; width: 100%;">
    <h2 style="color: #333; margin: 0 0 5px 0;">📦 Inventory Purchases</h2>

    <!-- Stats -->
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; width: 100%;">
        <div style="background: #f8f9fa; border-radius: 8px; padding: 10px; text-align: center; border: 1px solid #eee;">
            <div style="font-size: 20px; color: #007bff;" id="purchases-total-count">0</div>
            <div style="font-size: 11px; color: #666;">Total Purchases</div>
        </div>
        <div style="background: #f8f9fa; border-radius: 8px; padding: 10px; text-align: center; border: 1px solid #eee;">
            <div style="font-size: 20px; color: #28a745;" id="purchases-complete-count">0</div>
            <div style="font-size: 11px; color: #666;">With Records</div>
        </div>
        <div style="background: #f8f9fa; border-radius: 8px; padding: 10px; text-align: center; border: 1px solid #eee;">
            <div style="font-size: 20px; color: #ffc107;" id="purchases-draft-count">0</div>
            <div style="font-size: 11px; color: #666;">Empty</div>
        </div>
        <div style="background: #f8f9fa; border-radius: 8px; padding: 10px; text-align: center; border: 1px solid #eee;">
            <div style="font-size: 20px; color: #17a2b8;" id="purchases-total-records">0</div>
            <div style="font-size: 11px; color: #666;">Total Records</div>
        </div>
    </div>

    <!-- Actions -->
    <div style="display: flex; gap: 8px; width: 100%; flex-wrap: wrap;">
        <button onclick="purchasesCreate()" style="padding: 8px 16px; background: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600;">
            <i class="fas fa-plus"></i> New Purchase
        </button>
        <button onclick="purchasesRefresh()" style="padding: 8px 16px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600;">
            <i class="fas fa-sync"></i> Refresh
        </button>
    </div>

    <!-- Purchases Table -->
    <div style="width: 100%; flex: 1; overflow-y: auto; border: 1px solid #eee; border-radius: 8px; padding: 5px;">
        <div id="purchases-list" style="width: 100%;">
            <div style="text-align: center; padding: 40px; color: #999;">Loading purchases...</div>
        </div>
    </div>
</div>

<!-- ========== BULK ACTION MODAL ========== -->
<div id="purchases-action-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 10001; align-items: center; justify-content: center;">
    <div style="background: white; border-radius: 16px; max-width: 480px; width: 95%; padding: 28px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);">
        <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 16px;">
            <h2 id="purchases-action-title" style="margin: 0; color: #333; font-size: 20px;">Bulk Action</h2>
            <button onclick="purchasesCloseActionModal()" style="background: none; border: none; font-size: 28px; cursor: pointer; color: #999; padding: 0 8px;">&times;</button>
        </div>

        <p id="purchases-action-desc" style="color: #666; font-size: 14px; margin: 0 0 16px 0;"></p>

        <div id="purchases-action-body">
            <!-- Filled by JS -->
        </div>

        <div id="purchases-action-status" style="margin-top: 12px; display: none; padding: 10px; border-radius: 8px; font-size: 13px;"></div>

        <div style="display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end;">
            <button onclick="purchasesCloseActionModal()" style="padding: 10px 20px; background: #6c757d; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;">Cancel</button>
            <button id="purchases-action-confirm" onclick="purchasesApplyBulkAction()" style="padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;">
                <i class="fas fa-check"></i> Apply
            </button>
        </div>
    </div>
</div>

<style>
    .purchases-row-action-menu .pa-item:hover {
        background: #f8f9fa;
    }
    #purchases-list tr[data-id]:hover {
        background: #f1f8ff !important;
    }
</style>
