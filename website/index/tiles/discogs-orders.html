<div style="display: flex; flex-direction: column; align-items: center; justify-content: flex-start; height: 100%; background: white; border-radius: 16px; padding: 20px; gap: 10px; overflow: hidden; width: 100%;">
    <h2 style="color: #333; margin: 0 0 5px 0;">📦 Discogs Orders</h2>
    
    <!-- Filters -->
    <div style="display: flex; gap: 8px; width: 100%; flex-wrap: wrap; align-items: center;">
        <select id="discogs-orders-status" style="padding: 8px; border: 2px solid #ddd; border-radius: 8px; min-width: 150px;">
            <option value="">All Statuses</option>
            <option value="Payment Received">Payment Received</option>
            <option value="Shipped">Shipped</option>
            <option value="Delivered">Delivered</option>
            <option value="Cancelled">Cancelled</option>
            <option value="Refunded">Refunded</option>
        </select>
        <input type="date" id="discogs-orders-date-from" style="padding: 8px; border: 2px solid #ddd; border-radius: 8px;">
        <input type="date" id="discogs-orders-date-to" style="padding: 8px; border: 2px solid #ddd; border-radius: 8px;">
        <input type="text" id="discogs-orders-search" placeholder="Search buyer..." style="flex: 1; min-width: 150px; padding: 8px; border: 2px solid #ddd; border-radius: 8px;">
        <button onclick="discogsOrdersApplyFilters()" style="padding: 8px 16px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer;">
            <i class="fas fa-filter"></i> Apply
        </button>
        <button onclick="discogsOrdersRefresh()" style="padding: 8px 16px; background: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer;">
            <i class="fas fa-sync"></i> Refresh
        </button>
    </div>
    
    <!-- Order Select -->
    <div style="display: flex; gap: 10px; width: 100%; align-items: center; flex-wrap: wrap;">
        <label style="font-weight: 600; color: #555;">Order:</label>
        <select id="discogs-order-select" style="flex: 1; min-width: 300px; padding: 8px; border: 2px solid #ddd; border-radius: 8px;">
            <option value="">-- Select an order --</option>
        </select>
    </div>
    
    <!-- Status -->
    <div id="discogs-orders-status-msg" style="width: 100%; display: none; padding: 8px 12px; border-radius: 8px; font-size: 13px;"></div>
    
    <!-- Order Items -->
    <div style="width: 100%; flex: 1; overflow-y: auto; border: 1px solid #eee; border-radius: 8px; padding: 5px;">
        <div id="discogs-order-items" style="width: 100%;">
            <div style="text-align: center; padding: 20px; color: #999;">Select an order to view items</div>
        </div>
    </div>
</div>
