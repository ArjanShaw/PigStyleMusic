<div style="display: flex; flex-direction: column; align-items: center; justify-content: flex-start; height: 100%; background: white; border-radius: 16px; padding: 20px; gap: 10px; overflow: hidden; width: 100%;">
    <h2 style="color: #333; margin: 0 0 5px 0;">📦 Discogs Orders</h2>
    
    <!-- Filters -->
    <div style="display: flex; gap: 8px; width: 100%; flex-wrap: wrap; align-items: center;">
        <select id="discogs-orders-status" style="padding: 8px; border: 2px solid #ddd; border-radius: 8px; min-width: 150px;">
            <option value="">All Statuses</option>
            <option value="Payment Received">Payment Received</option>
            <option value="Shipped">Shipped</option>
            <option value="Delivered">Delivered</option>
            <option value="Cancelled">Cancelled</option>
            <option value="Refunded">Refunded</option>
        </select>
        <input type="date" id="discogs-orders-date-from" style="padding: 8px; border: 2px solid #ddd; border-radius: 8px;">
        <input type="date" id="discogs-orders-date-to" style="padding: 8px; border: 2px solid #ddd; border-radius: 8px;">
        <input type="text" id="discogs-orders-search" placeholder="Search buyer..." style="flex: 1; min-width: 150px; padding: 8px; border: 2px solid #ddd; border-radius: 8px;">
        <button onclick="discogsOrdersApplyFilters()" style="padding: 8px 16px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer;">
            <i class="fas fa-filter"></i> Apply
        </button>
        <button onclick="discogsOrdersRefresh()" style="padding: 8px 16px; background: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer;">
            <i class="fas fa-sync"></i> Refresh
        </button>
    </div>
    
    <!-- Status -->
    <div id="discogs-orders-status-msg" style="width: 100%; display: none; padding: 8px 12px; border-radius: 8px; font-size: 13px;"></div>
    
    <!-- Orders Table Container -->
    <div id="discogs-orders-container" style="width: 100%; flex: 2; overflow-y: auto; border: 1px solid #eee; border-radius: 8px; padding: 5px; transition: all 0.3s ease;">
        <div id="discogs-orders-table" style="width: 100%;">
            <div style="text-align: center; padding: 20px; color: #999;">Loading orders...</div>
        </div>
    </div>
    
    <!-- Order Items Section -->
    <div id="discogs-order-items-section" style="width: 100%; display: none; border: 1px solid #eee; border-radius: 8px; padding: 5px; margin-top: 5px; max-height: 60vh; overflow-y: auto;">
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; background: #f8f9fa; border-bottom: 2px solid #ddd; position: sticky; top: 0; z-index: 10;">
            <div>
                <span style="font-weight: 600; color: #333;">📦 Order Items</span>
                <span id="discogs-order-summary" style="margin-left: 10px; color: #666; font-size: 13px;"></span>
            </div>
            <div>
                <button onclick="discogsShowAllOrders()" style="padding: 4px 12px; background: #6c757d; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; margin-right: 5px;">
                    <i class="fas fa-arrow-left"></i> Back
                </button>
                <button onclick="discogsPrintShippingLabel()" style="padding: 4px 12px; background: #ff6b6b; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; margin-right: 5px;">
                    <i class="fas fa-truck"></i> Shipping Label
                </button>
                <button onclick="discogsExportOrder()" style="padding: 4px 12px; background: #17a2b8; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; margin-right: 5px;">
                    <i class="fas fa-download"></i> Export
                </button>
                <button onclick="discogsRefreshOrderItems()" style="padding: 4px 12px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">
                    <i class="fas fa-sync"></i> Refresh
                </button>
            </div>
        </div>
        <div id="discogs-order-items" style="width: 100%; padding: 5px;">
            <div style="text-align: center; padding: 20px; color: #999;">Loading items...</div>
        </div>
    </div>
</div>

<!-- Shipping Label Modal -->
<div id="discogs-shipping-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
    <div style="background: white; border-radius: 12px; padding: 24px; max-width: 600px; width: 90%; max-height: 90vh; overflow-y: auto; box-shadow: 0 4px 20px rgba(0,0,0,0.3);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h3 style="margin: 0; color: #333;"><i class="fas fa-truck"></i> Shipping Label</h3>
            <button onclick="discogsCloseShippingModal()" style="background: none; border: none; font-size: 24px; cursor: pointer; color: #999;">&times;</button>
        </div>
        
        <div style="margin-bottom: 20px;">
            <label style="display: block; font-weight: 600; color: #555; margin-bottom: 5px;">Upload PDF Label:</label>
            <input type="file" id="discogs-label-pdf" accept=".pdf" style="width: 100%; padding: 8px; border: 2px dashed #ddd; border-radius: 8px; cursor: pointer;">
            <div style="font-size: 12px; color: #999; margin-top: 5px;">Upload a PDF with Avery 5168 label format (2x2 labels per page)</div>
        </div>
        
        <div style="margin-bottom: 20px;">
            <label style="display: block; font-weight: 600; color: #555; margin-bottom: 5px;">Label Position on Sheet:</label>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <button onclick="discogsSelectLabelPosition('LT')" id="discogs-pos-LT" style="padding: 12px; border: 2px solid #007bff; border-radius: 8px; background: #e7f3ff; cursor: pointer; font-weight: 500; transition: all 0.2s;">
                    <i class="fas fa-arrow-up"></i> Top Left
                </button>
                <button onclick="discogsSelectLabelPosition('RT')" id="discogs-pos-RT" style="padding: 12px; border: 2px solid #ddd; border-radius: 8px; background: white; cursor: pointer; font-weight: 500; transition: all 0.2s;">
                    <i class="fas fa-arrow-up"></i> Top Right
                </button>
                <button onclick="discogsSelectLabelPosition('LB')" id="discogs-pos-LB" style="padding: 12px; border: 2px solid #ddd; border-radius: 8px; background: white; cursor: pointer; font-weight: 500; transition: all 0.2s;">
                    <i class="fas fa-arrow-down"></i> Bottom Left
                </button>
                <button onclick="discogsSelectLabelPosition('RB')" id="discogs-pos-RB" style="padding: 12px; border: 2px solid #ddd; border-radius: 8px; background: white; cursor: pointer; font-weight: 500; transition: all 0.2s;">
                    <i class="fas fa-arrow-down"></i> Bottom Right
                </button>
            </div>
            <div style="font-size: 12px; color: #999; margin-top: 5px;">Select where the label appears on the Avery 5168 sheet</div>
        </div>
        
        <div style="margin-bottom: 20px;">
            <label style="display: block; font-weight: 600; color: #555; margin-bottom: 5px;">Order Details:</label>
            <div style="background: #f8f9fa; padding: 12px; border-radius: 8px; font-size: 14px;">
                <div><strong>Order:</strong> <span id="discogs-label-order-id">—</span></div>
                <div><strong>Buyer:</strong> <span id="discogs-label-buyer">—</span></div>
                <div><strong>Items:</strong> <span id="discogs-label-items">—</span></div>
            </div>
        </div>
        
        <div style="display: flex; gap: 10px; justify-content: flex-end;">
            <button onclick="discogsCloseShippingModal()" style="padding: 10px 20px; background: #6c757d; color: white; border: none; border-radius: 8px; cursor: pointer;">
                Cancel
            </button>
            <button onclick="discogsPrintLabel()" style="padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer;">
                <i class="fas fa-print"></i> Generate & Print Label
            </button>
        </div>
    </div>
</div>

<!-- Hidden iframe for PDF printing -->
<iframe id="discogs-print-frame" style="display: none;"></iframe>
