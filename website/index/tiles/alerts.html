<div class="flip-card" id="flipCardAlerts">
    <div class="flip-card-front alerts-front">
        <span class="flip-hint"><i class="fas fa-rotate"></i> Tap to flip</span>
    </div>
    <div class="flip-card-back">
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: flex-start; height: 100%; background: white; border-radius: 16px; padding: 20px; gap: 10px; overflow: hidden;">
            <h2 style="color: #333; margin: 0 0 10px 0;">🔔 Record Alerts</h2>
            <div id="alertsResponse" style="color: #333; text-align: left; width: 100%; flex: 1; overflow-y: auto; font-size: 13px;">
                <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 20px; gap: 15px;">
                    <div style="font-size: 48px; color: #667eea;">🔔</div>
                    <h3 style="color: #333; margin: 0;">Get Notified</h3>
                    <p style="color: #666; text-align: center; max-width: 400px; margin: 0;">Enter your email and the artist you're looking for. We'll alert you when new records arrive!</p>
                    <div style="display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 350px;">
                        <input type="email" id="alertEmail" placeholder="Your Email" style="padding: 10px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px;">
                        <input type="text" id="alertArtist" placeholder="Artist Name" style="padding: 10px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px;">
                        <input type="text" id="alertTitle" placeholder="Album Title (optional)" style="padding: 10px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px;">
                        <button onclick="createAlert()" style="padding: 12px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 30px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s;">
                            <i class="fas fa-bell"></i> Subscribe
                        </button>
                        <div id="alertStatus" style="font-size: 14px; text-align: center;"></div>
                    </div>
                </div>
            </div>
        </div>
        <span class="flip-hint"><i class="fas fa-rotate"></i> Tap to flip back</span>
    </div>
</div>
