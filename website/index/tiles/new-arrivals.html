<div class="flip-card" id="flipCardNewArrivals">
    <div class="flip-card-front new-arrivals-front">
        <span class="flip-hint" onclick="this.closest('.flip-card').classList.toggle('flipped')"><i class="fas fa-rotate"></i> Tap to flip</span>
    </div>
    <div class="flip-card-back">
        <div style="width: 100%; height: 100%; background: rgba(255,255,255,0.95); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box;">
            <h2 style="text-align: center; margin: 0 0 8px 0; color: #333; border-bottom: 2px solid #ffd93d; padding-bottom: 8px; flex-shrink: 0;">✨ New Arrivals</h2>
            
            <!-- Search Bar -->
            <div style="display: flex; gap: 8px; margin-bottom: 10px; flex-shrink: 0;">
                <input type="text" id="newArrivalsSearchInput" placeholder="Search by artist, title, barcode, or ID..." style="flex: 1; padding: 8px 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px;">
                <button onclick="newArrivalsSearch()" style="padding: 8px 16px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer;">
                    <i class="fas fa-search"></i>
                </button>
                <button onclick="newArrivalsClearSearch()" style="padding: 8px 16px; background: #6c757d; color: white; border: none; border-radius: 8px; cursor: pointer;">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <!-- NEW: Filter Row - Genre + Price -->
            <div style="display: flex; gap: 10px; margin-bottom: 10px; flex-shrink: 0; flex-wrap: wrap; align-items: center; background: #f8f9fa; padding: 10px; border-radius: 8px; border: 1px solid #eee;">
                <!-- Genre Filter -->
                <div style="display: flex; align-items: center; gap: 6px; flex: 1; min-width: 150px;">
                    <label style="font-size: 13px; font-weight: 600; color: #555; white-space: nowrap;">🎵 Genre:</label>
                    <select id="newArrivalsGenreSelect" style="flex: 1; padding: 6px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; background: white; min-width: 120px;">
                        <option value="">All Genres</option>
                    </select>
                </div>
                
                <!-- Max Price Filter -->
                <div style="display: flex; align-items: center; gap: 6px; flex: 1; min-width: 150px;">
                    <label style="font-size: 13px; font-weight: 600; color: #555; white-space: nowrap;">💰 Max Price:</label>
                    <div style="display: flex; align-items: center; gap: 4px; flex: 1;">
                        <span style="font-size: 13px; color: #666;">$</span>
                        <input type="number" id="newArrivalsMaxPrice" placeholder="All" min="0" step="0.01" style="flex: 1; padding: 6px 8px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; width: 80px;">
                    </div>
                </div>
                
                <!-- Clear Filters Button -->
                <button onclick="newArrivalsClearFilters()" style="padding: 6px 14px; background: #dc3545; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; white-space: nowrap;">
                    <i class="fas fa-undo"></i> Clear
                </button>
            </div>
            
            <div id="newArrivalsCatalogContainer" style="flex: 1; overflow-y: auto; padding: 5px 0; min-height: 0;">
                <div style="text-align: center; padding: 40px; color: #888;">
                    <div style="margin-bottom: 10px;">⏳</div>
                    <p>Loading new arrivals...</p>
                </div>
            </div>
            
            <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 12px; border-top: 1px solid #ddd; flex-wrap: wrap; gap: 8px; flex-shrink: 0;">
                <div style="font-size: 13px; color: #888;">
                    Showing <span id="newArrivalsShowingRange">0-0</span> of <span id="newArrivalsTotalRecords">0</span> new arrivals
                </div>
                <div style="display: flex; gap: 6px; align-items: center;">
                    <button id="newArrivalsFirstPage" style="padding: 4px 10px; border: 1px solid #ddd; border-radius: 4px; background: white; cursor: pointer;"><i class="fas fa-angle-double-left"></i></button>
                    <button id="newArrivalsPrevPage" style="padding: 4px 10px; border: 1px solid #ddd; border-radius: 4px; background: white; cursor: pointer;"><i class="fas fa-angle-left"></i></button>
                    <span id="newArrivalsPageInfo" style="font-size: 13px; padding: 0 8px;">1 / 1</span>
                    <button id="newArrivalsNextPage" style="padding: 4px 10px; border: 1px solid #ddd; border-radius: 4px; background: white; cursor: pointer;"><i class="fas fa-angle-right"></i></button>
                    <button id="newArrivalsLastPage" style="padding: 4px 10px; border: 1px solid #ddd; border-radius: 4px; background: white; cursor: pointer;"><i class="fas fa-angle-double-right"></i></button>
                </div>
            </div>
        </div>
        <span class="flip-hint" onclick="this.closest('.flip-card').classList.toggle('flipped')"><i class="fas fa-rotate"></i> Tap to flip back</span>
    </div>
</div>
