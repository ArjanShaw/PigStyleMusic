<div class="flip-card" id="flipCardOrder">
    <div class="flip-card-front order-front">
        <span class="flip-hint"><i class="fas fa-rotate"></i> Tap to flip</span>
    </div>
    <div class="flip-card-back">
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: flex-start; height: 100%; background: white; border-radius: 16px; padding: 20px; gap: 10px; overflow: hidden;">
            <h2 style="color: #333; margin: 0 0 10px 0;">📦 Order Records</h2>
            <div id="orderResponse" style="color: #333; text-align: left; width: 100%; flex: 1; overflow-y: auto; font-size: 13px;">
                <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 20px; gap: 15px;">
                    <div style="font-size: 48px; color: #28a745;">📦</div>
                    <h3 style="color: #333; margin: 0;">Request a Record</h3>
                    <p style="color: #666; text-align: center; max-width: 400px; margin: 0;">Don't see what you're looking for? Request it and we'll try to get it for you!</p>
                    <div style="display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 350px;">
                        <input type="text" id="orderContact" placeholder="Email or Phone Number" style="padding: 10px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px;">
                        <input type="text" id="orderArtist" placeholder="Artist Name" style="padding: 10px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px;">
                        <input type="text" id="orderTitle" placeholder="Album Title" style="padding: 10px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px;">
                        <select id="orderFormat" style="padding: 10px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px; background: white; color: #333;">
                            <option value="">Any Format</option>
                            <option value="Vinyl">Vinyl</option>
                            <option value="CD">CD</option>
                            <option value="Cassette">Cassette</option>
                            <option value="8-Track Cartridge">8-Track Cartridge</option>
                            <option value="Shellac">Shellac</option>
                            <option value="Flexi-disc">Flexi-disc</option>
                            <option value="Box Set">Box Set</option>
                        </select>
                        <button onclick="createOrder()" style="padding: 12px; background: #28a745; color: white; border: none; border-radius: 30px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s;">
                            <i class="fas fa-box"></i> Place Order Request
                        </button>
                        <div id="orderStatus" style="font-size: 14px; text-align: center;"></div>
                    </div>
                </div>
            </div>
        </div>
        <span class="flip-hint"><i class="fas fa-rotate"></i> Tap to flip back</span>
    </div>
</div>

<script>
// Order page - record request form
(function() {
    window.createOrder = async function() {
        const contact = document.getElementById('orderContact').value.trim();
        const artist = document.getElementById('orderArtist').value.trim();
        const title = document.getElementById('orderTitle').value.trim();
        const format = document.getElementById('orderFormat').value;
        const statusDiv = document.getElementById('orderStatus');

        if (!contact) {
            statusDiv.innerHTML = '<span style="color:#dc3545;">⚠️ Please enter your email or phone number</span>';
            return;
        }

        // Validate: either a valid email OR a valid phone number
        const isEmail = contact.includes('@') && contact.includes('.');
        const isPhone = /^[\d\s\-\(\)\+\.]{7,}$/.test(contact);

        if (!isEmail && !isPhone) {
            statusDiv.innerHTML = '<span style="color:#dc3545;">⚠️ Please enter a valid email or phone number</span>';
            return;
        }

        if (!artist) {
            statusDiv.innerHTML = '<span style="color:#dc3545;">⚠️ Please enter an artist name</span>';
            return;
        }
        if (!title) {
            statusDiv.innerHTML = '<span style="color:#dc3545;">⚠️ Please enter an album title</span>';
            return;
        }

        statusDiv.innerHTML = '<span style="color:#666;">⏳ Submitting request...</span>';

        try {
            const response = await fetch('/api/record-orders', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contact: contact,
                    artist: artist,
                    title: title,
                    format: format || null
                })
            });

            const data = await response.json();
            console.log('Order response:', data);

            if (data.status === 'success') {
                statusDiv.innerHTML = '<span style="color:#28a745;">✅ Order request placed! We\'ll notify you when it arrives.</span>';
                document.getElementById('orderContact').value = '';
                document.getElementById('orderArtist').value = '';
                document.getElementById('orderTitle').value = '';
                document.getElementById('orderFormat').value = '';
            } else {
                statusDiv.innerHTML = '<span style="color:#dc3545;">❌ Error: ' + (data.error || 'Failed to place order') + '</span>';
            }
        } catch(err) {
            console.error('Error creating order:', err);
            statusDiv.innerHTML = '<span style="color:#dc3545;">❌ Network error. Please try again.</span>';
        }
    };

    window.initOrder = function() {
        console.log('Order initialized');
    };
})();
</script>
