<!-- Gift Cards page UI with barcode linking -->
<div style="display: flex; flex-direction: column; align-items: center; justify-content: flex-start; height: 100%; background: white; border-radius: 16px; padding: 20px; gap: 10px; overflow: hidden; width: 100%;">
    <h2 style="color: #333; margin: 0 0 5px 0;">🎁 Gift Cards</h2>
    <p style="color: #666; margin: 0 0 10px 0;">Link credit to existing barcodes</p>
    
    <!-- Actions -->
    <div style="display: flex; gap: 8px; width: 100%; flex-wrap: wrap;">
        <button onclick="gcShowCreate()" style="padding: 8px 16px; background: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600;">
            <i class="fas fa-link"></i> Link Credit to Barcode
        </button>
        <button onclick="gcRefresh()" style="padding: 8px 16px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600;">
            <i class="fas fa-sync"></i> Refresh
        </button>
        <button onclick="gcPrintBarcodes()" style="padding: 8px 16px; background: #6f42c1; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600;">
            <i class="fas fa-print"></i> Print Barcodes
        </button>
    </div>
    
    <!-- Search -->
    <div style="display: flex; gap: 10px; width: 100%; flex-wrap: wrap;">
        <input type="text" id="gc-search" placeholder="Search by barcode or recipient..." style="flex: 1; min-width: 150px; padding: 10px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px;">
        <button onclick="gcSearch()" style="padding: 8px 16px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer;">
            <i class="fas fa-search"></i> Search
        </button>
        <button onclick="gcClear()" style="padding: 8px 16px; background: #6c757d; color: white; border: none; border-radius: 8px; cursor: pointer;">
            <i class="fas fa-times"></i> Clear
        </button>
    </div>
    
    <!-- Gift Cards Table -->
    <div style="width: 100%; flex: 1; overflow-y: auto; border: 1px solid #eee; border-radius: 8px; padding: 5px;">
        <div id="gc-list" style="width: 100%;">
            <div style="text-align: center; padding: 40px; color: #999;">Loading gift cards...</div>
        </div>
    </div>
</div>

<!-- Create Gift Card Modal - Barcode linking version -->
<div id="gc-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 10001; align-items: center; justify-content: center;">
    <div style="background: white; border-radius: 16px; max-width: 500px; width: 95%; max-height: 90vh; overflow-y: auto; padding: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);">
        <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 20px;">
            <h2 style="margin: 0; color: #333; font-size: 20px;">🔗 Link Credit to Barcode</h2>
            <button onclick="gcCloseModal()" style="background: none; border: none; font-size: 28px; cursor: pointer; color: #999; padding: 0 8px;">&times;</button>
        </div>
        
        <!-- Barcode Section -->
        <div style="margin-bottom: 12px;">
            <label style="display: block; font-weight: 600; color: #555; font-size: 13px; margin-bottom: 4px;">
                Barcode / Card Code *
            </label>
            <div style="display: flex; gap: 8px; align-items: center;">
                <input type="text" id="gc-barcode" placeholder="Scan or enter barcode..." 
                       style="flex: 1; padding: 10px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px; font-family: monospace; text-transform: uppercase;">
                <button onclick="gcScanBarcode()" style="padding: 10px 16px; background: #6f42c1; color: white; border: none; border-radius: 8px; cursor: pointer;">
                    <i class="fas fa-camera"></i> Scan
                </button>
            </div>
            <div id="gc-barcode-status" style="margin-top: 4px; font-size: 12px; color: #666;"></div>
        </div>
        
        <!-- Record Info Display -->
        <div id="gc-record-info" style="display: none; padding: 10px; background: #e8f0fe; border-radius: 8px; margin-bottom: 12px; font-size: 13px;">
            <div id="gc-record-details"></div>
        </div>
        
        <!-- Existing Gift Card Info -->
        <div id="gc-existing-card" style="display: none; padding: 10px; background: #fff3cd; border-radius: 8px; margin-bottom: 12px; font-size: 13px; border-left: 4px solid #ffc107;">
            <div id="gc-existing-details"></div>
        </div>
        
        <!-- Card Value -->
        <div style="margin-bottom: 12px;">
            <label style="display: block; font-weight: 600; color: #555; font-size: 13px; margin-bottom: 4px;">Credit Amount ($) *</label>
            <input type="number" id="gc-value" placeholder="25.00" step="0.01" min="0.01" 
                   style="width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px;">
            <div style="display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap;">
                <button onclick="document.getElementById('gc-value').value=10" style="padding: 4px 14px; background: #e9ecef; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; font-size: 12px;">$10</button>
                <button onclick="document.getElementById('gc-value').value=25" style="padding: 4px 14px; background: #e9ecef; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; font-size: 12px;">$25</button>
                <button onclick="document.getElementById('gc-value').value=50" style="padding: 4px 14px; background: #e9ecef; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; font-size: 12px;">$50</button>
                <button onclick="document.getElementById('gc-value').value=100" style="padding: 4px 14px; background: #e9ecef; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; font-size: 12px;">$100</button>
            </div>
        </div>
        
        <!-- Recipient Name -->
        <div style="margin-bottom: 12px;">
            <label style="display: block; font-weight: 600; color: #555; font-size: 13px; margin-bottom: 4px;">Recipient Name *</label>
            <input type="text" id="gc-recipient" placeholder="Recipient name" 
                   style="width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px;">
        </div>
        
        <!-- Notes -->
        <div style="margin-bottom: 12px;">
            <label style="display: block; font-weight: 600; color: #555; font-size: 13px; margin-bottom: 4px;">Notes</label>
            <input type="text" id="gc-notes" placeholder="Reason for gift card" 
                   style="width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px;">
        </div>
        
        <!-- Payment Method -->
        <div style="margin-bottom: 12px;">
            <label style="display: block; font-weight: 600; color: #555; font-size: 13px; margin-bottom: 4px;">Payment Method *</label>
            <select id="gc-payment-method" style="width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px; background: white;">
                <option value="cash">Cash</option>
                <option value="card">Card</option>
                <option value="venmo">Venmo</option>
                <option value="paypal">PayPal</option>
                <option value="square">Square</option>
                <option value="store_credit">Store Credit</option>
                <option value="other">Other</option>
            </select>
        </div>
        
        <!-- Status Message -->
        <div id="gc-status" style="display: none; padding: 10px; border-radius: 8px; font-size: 13px; margin-top: 10px;"></div>
        
        <!-- Buttons -->
        <div style="display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end;">
            <button onclick="gcCloseModal()" style="padding: 10px 24px; background: #6c757d; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;">Cancel</button>
            <button onclick="gcCreate()" id="gc-btn" style="padding: 10px 24px; background: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;">
                <i class="fas fa-link"></i> Link Credit
            </button>
        </div>
    </div>
</div>

<!-- Print Barcodes Modal -->
<div id="gc-print-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 10002; align-items: center; justify-content: center;">
    <div style="background: white; border-radius: 16px; max-width: 450px; width: 95%; padding: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);">
        <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 20px;">
            <h2 style="margin: 0; color: #333; font-size: 20px;">🖨️ Print Barcodes</h2>
            <button onclick="gcClosePrintModal()" style="background: none; border: none; font-size: 28px; cursor: pointer; color: #999; padding: 0 8px;">&times;</button>
        </div>
        <div style="margin-bottom: 12px;">
            <label style="display: block; font-weight: 600; color: #555; font-size: 13px; margin-bottom: 4px;">Number of barcodes to print</label>
            <input type="number" id="gc-print-count" value="10" min="1" max="100" style="width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px;">
        </div>
        <div style="display: flex; gap: 10px; justify-content: flex-end;">
            <button onclick="gcClosePrintModal()" style="padding: 10px 24px; background: #6c757d; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;">Cancel</button>
            <button onclick="gcGeneratePrintBarcodes()" style="padding: 10px 24px; background: #6f42c1; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;">
                <i class="fas fa-print"></i> Generate
            </button>
        </div>
    </div>
</div>
