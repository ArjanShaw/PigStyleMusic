<div style="display: flex; flex-direction: column; align-items: center; justify-content: flex-start; height: 100%; background: white; border-radius: 16px; padding: 20px; gap: 10px; overflow: hidden; width: 100%;">
    <h2 style="color: #333; margin: 0 0 5px 0;">🎁 Gift Cards</h2>
    <p style="color: #666; margin: 0 0 10px 0;">Create and manage gift cards</p>
    
    <!-- Stats -->
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; width: 100%;">
        <div style="background: #f8f9fa; border-radius: 8px; padding: 10px; text-align: center; border: 1px solid #eee;">
            <div style="font-size: 20px; color: #28a745;" id="gc-total">0</div>
            <div style="font-size: 10px; color: #666;">Total Cards</div>
        </div>
        <div style="background: #f8f9fa; border-radius: 8px; padding: 10px; text-align: center; border: 1px solid #eee;">
            <div style="font-size: 20px; color: #007bff;" id="gc-active">0</div>
            <div style="font-size: 10px; color: #666;">Active</div>
        </div>
        <div style="background: #f8f9fa; border-radius: 8px; padding: 10px; text-align: center; border: 1px solid #eee;">
            <div style="font-size: 20px; color: #ffc107;" id="gc-total-value">$0</div>
            <div style="font-size: 10px; color: #666;">Total Value</div>
        </div>
    </div>
    
    <!-- Actions -->
    <div style="display: flex; gap: 8px; width: 100%; flex-wrap: wrap;">
        <button onclick="gcShowCreate()" style="padding: 8px 16px; background: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600;">
            <i class="fas fa-plus"></i> Create Gift Card
        </button>
        <button onclick="gcRefresh()" style="padding: 8px 16px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600;">
            <i class="fas fa-sync"></i> Refresh
        </button>
    </div>
    
    <!-- Search -->
    <div style="display: flex; gap: 10px; width: 100%;">
        <input type="text" id="gc-search" placeholder="Search by code or recipient..." style="flex: 1; padding: 8px; border: 2px solid #ddd; border-radius: 6px; font-size: 13px;">
        <button onclick="gcSearch()" style="padding: 6px 14px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer;">
            <i class="fas fa-search"></i>
        </button>
        <button onclick="gcClear()" style="padding: 6px 14px; background: #6c757d; color: white; border: none; border-radius: 6px; cursor: pointer;">
            <i class="fas fa-times"></i>
        </button>
    </div>
    
    <!-- Gift Cards Table -->
    <div style="width: 100%; flex: 1; overflow-y: auto; border: 1px solid #eee; border-radius: 8px; padding: 5px;">
        <div id="gc-list" style="width: 100%;">
            <div style="text-align: center; padding: 40px; color: #999;">Loading gift cards...</div>
        </div>
    </div>
</div>

<!-- Create Gift Card Modal -->
<div id="gc-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 10001; align-items: center; justify-content: center;">
    <div style="background: white; border-radius: 16px; max-width: 450px; width: 95%; max-height: 90vh; overflow-y: auto; padding: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);">
        <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 20px;">
            <h2 style="margin: 0; color: #333; font-size: 20px;">🎁 Create Gift Card</h2>
            <button onclick="gcCloseModal()" style="background: none; border: none; font-size: 28px; cursor: pointer; color: #999; padding: 0 8px;">&times;</button>
        </div>
        <div style="margin-bottom: 12px;">
            <label style="display: block; font-weight: 600; color: #555; font-size: 13px; margin-bottom: 4px;">Card Value ($) *</label>
            <input type="number" id="gc-value" placeholder="25.00" step="0.01" min="0.01" style="width: 100%; padding: 8px; border: 2px solid #ddd; border-radius: 8px;">
            <div style="display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap;">
                <button onclick="document.getElementById('gc-value').value=10" style="padding: 2px 12px; background: #e9ecef; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; font-size: 12px;">$10</button>
                <button onclick="document.getElementById('gc-value').value=25" style="padding: 2px 12px; background: #e9ecef; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; font-size: 12px;">$25</button>
                <button onclick="document.getElementById('gc-value').value=50" style="padding: 2px 12px; background: #e9ecef; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; font-size: 12px;">$50</button>
                <button onclick="document.getElementById('gc-value').value=100" style="padding: 2px 12px; background: #e9ecef; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; font-size: 12px;">$100</button>
            </div>
        </div>
        <div style="margin-bottom: 12px;">
            <label style="display: block; font-weight: 600; color: #555; font-size: 13px; margin-bottom: 4px;">Recipient Name *</label>
            <input type="text" id="gc-recipient" placeholder="Recipient name" style="width: 100%; padding: 8px; border: 2px solid #ddd; border-radius: 8px;">
        </div>
        <div style="margin-bottom: 12px;">
            <label style="display: block; font-weight: 600; color: #555; font-size: 13px; margin-bottom: 4px;">Notes</label>
            <input type="text" id="gc-notes" placeholder="Reason for gift card" style="width: 100%; padding: 8px; border: 2px solid #ddd; border-radius: 8px;">
        </div>
        <div id="gc-status" style="margin-top: 10px; display: none; padding: 10px; border-radius: 8px; font-size: 13px;"></div>
        <div style="display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end;">
            <button onclick="gcCloseModal()" style="padding: 10px 20px; background: #6c757d; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;">Cancel</button>
            <button onclick="gcCreate()" id="gc-btn" style="padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;">
                <i class="fas fa-gift"></i> Create
            </button>
        </div>
    </div>
</div>
