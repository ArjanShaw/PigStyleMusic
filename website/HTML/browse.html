<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <link rel="icon" href="/static/images/PigStyle.ico">
    <title>Browse Records - PigStyle Music</title>
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-03HFDR9PV7"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-03HFDR9PV7');
    </script>
    
    <!-- CSS FILES -->
    <link rel="stylesheet" href="/static/css/browse.css">
    <link rel="stylesheet" href="/static/css/shared.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <script src="/static/js/app-config.js"></script>
    <script src="/static/js/config-value-manager.js"></script>
    <script src="/static/js/notification-bell.js"></script>
    <script src="/static/js/shared.js"></script>
</head>
<body>
    <!-- Background -->
    <div class="background-container">
        <img src="/static/images/background.png" alt="Background" class="background-image">
        <div class="background-overlay"></div>
    </div>
    
    <!-- ===== NAVBAR PLACEHOLDER ===== -->
    <div id="navbar-placeholder"></div>
    
    <!-- ===== SUBSCRIPTION MODAL PLACEHOLDER ===== -->
    <div id="subscription-modal-placeholder"></div>

    <div class="header-section">
        <div class='search-wrapper'>
            <input type='text' id='searchBox' placeholder='Search by artist or record title...'>
        </div>
        
        <div class="filter-section">
            <!-- Genre Filter -->
            <div class="filter-group">
                <button id="genreFilterBtn" class="filter-btn">
                    <i class="fas fa-filter"></i> Genre
                </button>
                <div id="genreDropdown" class="filter-checkbox-container">
                    <div class="filter-checkbox-group" id="genreList">
                        <div style="color: #999; text-align: center; padding: 20px;">Loading genres...</div>
                    </div>
                    <div class="filter-actions">
                        <button id="selectAllGenres" class="filter-action-btn">All</button>
                        <button id="clearAllGenres" class="filter-action-btn">Clear</button>
                        <button id="applyGenres" class="filter-action-btn filter-apply">Apply</button>
                    </div>
                </div>
            </div>
            
            <!-- Format Filter -->
            <div class="filter-group">
                <button id="formatFilterBtn" class="filter-btn">
                    <i class="fas fa-record-vinyl"></i> Format
                </button>
                <div id="formatDropdown" class="filter-checkbox-container">
                    <div class="filter-checkbox-group" id="formatList">
                        <div style="color: #999; text-align: center; padding: 20px;">Loading formats...</div>
                    </div>
                    <div class="filter-actions">
                        <button id="selectAllFormats" class="filter-action-btn">All</button>
                        <button id="clearAllFormats" class="filter-action-btn">Clear</button>
                        <button id="applyFormats" class="filter-action-btn filter-apply">Apply</button>
                    </div>
                </div>
            </div>
            
            <button id="newArrivalsBtn" class="filter-btn active">
                <i class="fas fa-calendar-week"></i> New Arrivals
            </button>
            
            <button id="newVinylBtn" class="filter-btn">
                <i class="fas fa-record-vinyl"></i> New Vinyl
            </button>
        </div>
        
        <div id="filterStatusRow" class="filter-status-row" style="display: none;">
            <div class="filter-summary" id="filterSummary"></div>
            <button id="clearAllFiltersBtn" class="clear-filters-link">Clear all ✕</button>
        </div>
    </div>
    
    <div class='catalog-container' id='catalogContainer'>
        <div class="loading-indicator">
            <div class="loading-dots">
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>
            <p>Loading records...</p>
        </div>
    </div>

    <script>
        let allRecords = [];
        let availableGenres = [];
        let selectedGenres = [];
        let selectedFormatIds = [];
        let currentSearchTerm = '';
        let newArrivalsActive = true;
        let newVinylActive = false;
        let currentPage = 1;
        let recordsPerPage = 50;
        let allFormats = [];

        // Load navbar and subscription modal from shared components
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof loadNavbar === 'function') {
                loadNavbar();
            } else {
                console.warn('loadNavbar function not found, make sure shared.js is loaded');
            }
            
            if (typeof loadSubscriptionModal === 'function') {
                loadSubscriptionModal();
            } else {
                console.warn('loadSubscriptionModal function not found, make sure shared.js is loaded');
            }
            
            initBrowsePage();
        });

        async function initBrowsePage() {
            if (typeof initSubscriptionModal === 'function') {
                initSubscriptionModal();
            }
            
            await fetchFormats();
            await loadCatalogData();
            setupEventListeners();
        }

        function setupEventListeners() {
            document.getElementById('clearAllFiltersBtn')?.addEventListener('click', () => { 
                selectedGenres = []; 
                selectedFormatIds = [];
                currentSearchTerm = ''; 
                newArrivalsActive = true; 
                newVinylActive = false; 
                currentPage = 1; 
                document.getElementById('searchBox').value = ''; 
                document.querySelectorAll('#genreList input').forEach(cb => cb.checked = false);
                document.querySelectorAll('#formatList input').forEach(cb => cb.checked = false);
                loadCatalogData(); 
            });
            
            document.getElementById('newArrivalsBtn')?.addEventListener('click', () => { 
                newArrivalsActive = !newArrivalsActive; 
                currentPage = 1; 
                loadCatalogData(); 
            });
            
            document.getElementById('newVinylBtn')?.addEventListener('click', () => { 
                newVinylActive = !newVinylActive; 
                currentPage = 1; 
                loadCatalogData(); 
            });
            
            document.getElementById('searchBox')?.addEventListener('input', debounce(() => loadCatalogData(), 500));
            
            // Genre dropdown
            const genreBtn = document.getElementById('genreFilterBtn');
            const genreDropdown = document.getElementById('genreDropdown');
            genreBtn?.addEventListener('click', (e) => { 
                e.stopPropagation(); 
                genreDropdown.classList.toggle('show'); 
                document.getElementById('formatDropdown')?.classList.remove('show');
            });
            
            // Format dropdown
            const formatBtn = document.getElementById('formatFilterBtn');
            const formatDropdown = document.getElementById('formatDropdown');
            formatBtn?.addEventListener('click', (e) => { 
                e.stopPropagation(); 
                formatDropdown.classList.toggle('show');
                document.getElementById('genreDropdown')?.classList.remove('show');
            });
            
            document.addEventListener('click', (e) => { 
                if (!genreDropdown?.contains(e.target) && e.target !== genreBtn) 
                    genreDropdown?.classList.remove('show');
                if (!formatDropdown?.contains(e.target) && e.target !== formatBtn)
                    formatDropdown?.classList.remove('show');
            });
            
            document.getElementById('selectAllGenres')?.addEventListener('click', () => { 
                document.querySelectorAll('#genreList input').forEach(cb => cb.checked = true); 
            });
            
            document.getElementById('clearAllGenres')?.addEventListener('click', () => { 
                document.querySelectorAll('#genreList input').forEach(cb => cb.checked = false); 
            });
            
            document.getElementById('applyGenres')?.addEventListener('click', () => { 
                selectedGenres = Array.from(document.querySelectorAll('#genreList input:checked')).map(cb => cb.value); 
                genreDropdown.classList.remove('show'); 
                currentPage = 1; 
                loadCatalogData(); 
            });
            
            document.getElementById('selectAllFormats')?.addEventListener('click', () => { 
                document.querySelectorAll('#formatList input').forEach(cb => cb.checked = true); 
            });
            
            document.getElementById('clearAllFormats')?.addEventListener('click', () => { 
                document.querySelectorAll('#formatList input').forEach(cb => cb.checked = false); 
            });
            
            document.getElementById('applyFormats')?.addEventListener('click', () => { 
                selectedFormatIds = Array.from(document.querySelectorAll('#formatList input:checked')).map(cb => parseInt(cb.value));
                formatDropdown.classList.remove('show'); 
                currentPage = 1; 
                loadCatalogData(); 
            });
        }
        
        async function fetchFormats() {
            try {
                const response = await fetch(`${AppConfig.baseUrl}/api/formats`);
                if (response.ok) {
                    const data = await response.json();
                    if (data.status === 'success' && data.formats) {
                        allFormats = data.formats;
                        populateFormatDropdown(allFormats);
                        return;
                    }
                }
                allFormats = [];
            } catch (e) {
                console.error('Error fetching formats:', e);
                allFormats = [];
            }
        }

        function getFormatName(formatId) {
            if (!formatId) return null;
            const format = allFormats.find(f => f.id === formatId);
            return format ? format.name : null;
        }

        function extractGenreFromDiscogsRaw(discogs_genre_raw) {
            if (!discogs_genre_raw || discogs_genre_raw === 'NULL' || discogs_genre_raw.trim() === '') return null;
            const genres = discogs_genre_raw.split(',').map(g => g.trim());
            return genres[0] || null;
        }

        function getConditionDisplayName(conditionId) {
            const map = {1: 'Mint', 2: 'Near Mint', 3: 'VG+', 4: 'VG', 5: 'G+', 6: 'G', 7: 'Fair', 8: 'Poor'};
            return map[conditionId] || 'Unknown';
        }

        function getCombinedCondition(discId, sleeveId) {
            const disc = getConditionDisplayName(discId);
            const sleeve = getConditionDisplayName(sleeveId);
            if (disc === sleeve) return disc;
            return `${disc}/${sleeve}`;
        }

        function isNewVinyl(record) {
            return record.condition_disc_id === 1 && record.condition_sleeve_id === 1;
        }

        function displayRecords(records) {
            const container = document.getElementById('catalogContainer');
            const totalRecords = records.length;
            const totalPages = Math.ceil(totalRecords / recordsPerPage);
            const startIndex = (currentPage - 1) * recordsPerPage;
            const endIndex = startIndex + recordsPerPage;
            const pageRecords = records.slice(startIndex, endIndex);
            
            container.innerHTML = '';
            
            if (!pageRecords || pageRecords.length === 0) {
                container.innerHTML = `<div class="no-records-message"><i class="fas fa-search"></i><p>No records match your filters.</p></div>`;
                return;
            }
            
            const grid = document.createElement('div');
            grid.className = 'records-grid';
            pageRecords.forEach(record => grid.appendChild(createRecordCard(record)));
            container.appendChild(grid);
            
            if (totalPages > 1) {
                addPaginationControls(totalPages, totalRecords);
            }
        }
        
        function addPaginationControls(totalPages, totalRecords) {
            const container = document.getElementById('catalogContainer');
            const existingPagination = document.getElementById('pagination-controls');
            if (existingPagination) existingPagination.remove();
            
            const paginationDiv = document.createElement('div');
            paginationDiv.id = 'pagination-controls';
            
            const prevBtn = document.createElement('button');
            prevBtn.innerHTML = '← Previous';
            prevBtn.className = 'pagination-btn';
            prevBtn.disabled = currentPage === 1;
            prevBtn.onclick = () => {
                if (currentPage > 1) {
                    currentPage--;
                    displayRecords(allRecords);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            };
            
            const pageInfo = document.createElement('span');
            pageInfo.className = 'pagination-info';
            pageInfo.textContent = `Page ${currentPage} of ${totalPages} (${totalRecords} records)`;
            
            const nextBtn = document.createElement('button');
            nextBtn.innerHTML = 'Next →';
            nextBtn.className = 'pagination-btn';
            nextBtn.disabled = currentPage === totalPages;
            nextBtn.onclick = () => {
                if (currentPage < totalPages) {
                    currentPage++;
                    displayRecords(allRecords);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            };
            
            paginationDiv.appendChild(prevBtn);
            paginationDiv.appendChild(pageInfo);
            paginationDiv.appendChild(nextBtn);
            container.appendChild(paginationDiv);
        }

        async function loadCatalogData() {
            const searchBox = document.getElementById('searchBox');
            currentSearchTerm = searchBox ? searchBox.value.trim() : '';
            currentPage = 1;
            
            // Build params - all filtering now done by backend
            let params = new URLSearchParams();
            
            // Status filter - only active records
            params.append('status_ids', '2');
            
            // Search - now separate fields
            if (currentSearchTerm) {
                // For simplicity, use artist and title search
                // Could be enhanced with more specific fields
                params.append('artist', currentSearchTerm);
                params.append('title', currentSearchTerm);
            }
            
            // Genre filter
            if (selectedGenres.length > 0) {
                params.append('genres', selectedGenres.join(','));
            }
            
            // Format filter
            if (selectedFormatIds.length > 0) {
                params.append('format_ids', selectedFormatIds.join(','));
            }
            
            // Date filters (backend handles created_after)
            // New Arrivals: last 7 days
            if (newArrivalsActive) {
                const sevenDaysAgo = new Date();
                sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
                params.append('created_after', sevenDaysAgo.toISOString().split('T')[0]);
            }
            
            // New Vinyl: condition_disc_id=1 AND condition_sleeve_id=1
            // This is a client-side filter since it's not a simple field filter
            // We'll handle it after fetching
            
            // Require image
            params.append('require_image', 'true');
            
            // Order by newest first
            params.append('order_by', 'created_at');
            params.append('order_dir', 'DESC');
            
            // Get cutoff days from config for older records
            let cutoffDays = 30;
            try {
                const configResponse = await fetch(`${AppConfig.baseUrl}/config/INVENTORY_CUTOFF_DAYS`);
                if (configResponse.ok) {
                    const configData = await configResponse.json();
                    if (configData.config_value) {
                        cutoffDays = parseInt(configData.config_value) || 30;
                    }
                }
            } catch (e) {
                console.warn('Could not fetch INVENTORY_CUTOFF_DAYS, using default 30');
            }
            
            // Apply cutoff filter using created_after
            const cutoffDate = new Date();
            cutoffDate.setDate(cutoffDate.getDate() - cutoffDays);
            params.append('created_after', cutoffDate.toISOString().split('T')[0]);
            
            const url = `${AppConfig.baseUrl}/records?${params.toString()}`;
            
            // LOG THE REQUEST
            console.log('=== BROWSE REQUEST ===');
            console.log('URL:', url);
            console.log('Request Params:', Object.fromEntries(params));
            console.log('Full URL:', url);
            
            document.getElementById('catalogContainer').innerHTML = `<div class="loading-indicator"><div class="loading-dots"><div></div><div></div><div></div><div></div></div><p>Loading records...</p></div>`;
            
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                
                // LOG THE RESPONSE
                console.log('=== BROWSE RESPONSE ===');
                console.log('Response Status:', response.status);
                console.log('Response Data Count:', data.count);
                console.log('Response Records Count:', data.records ? data.records.length : 0);
                
                if (data.status === 'success') {
                    let records = data.records || [];
                    
                    // Apply new vinyl filter (client-side)
                    if (newVinylActive) {
                        records = records.filter(r => isNewVinyl(r));
                    }
                    
                    allRecords = records;
                    
                    // Extract unique genres from discogs_genre_raw
                    const genreSet = new Set();
                    records.forEach(r => {
                        const genre = extractGenreFromDiscogsRaw(r.discogs_genre_raw);
                        if (genre) genreSet.add(genre);
                    });
                    
                    availableGenres = Array.from(genreSet).sort();
                    populateGenreDropdown();
                    displayRecords(allRecords);
                    updateFilterUI();
                } else {
                    console.error('API returned error:', data);
                    document.getElementById('catalogContainer').innerHTML = `<div class="error-message"><i class="fas fa-exclamation-triangle"></i><h2>Error</h2><p>${data.error || 'Unknown error'}</p></div>`;
                }
            } catch (error) {
                console.error('Error loading catalog:', error);
                document.getElementById('catalogContainer').innerHTML = `<div class="error-message"><i class="fas fa-exclamation-triangle"></i><h2>Failed to Load</h2><p>${error.message}</p><button class="retry-btn" onclick="location.reload()">Retry</button></div>`;
            }
        }

        function populateGenreDropdown() {
            const genreList = document.getElementById('genreList');
            if (!genreList) return;
            if (availableGenres.length === 0) {
                genreList.innerHTML = '<div style="color: #999; text-align: center;">No genres available</div>';
                return;
            }
            genreList.innerHTML = availableGenres.map(genre => `
                <div class="filter-checkbox-item">
                    <input type="checkbox" id="genre_${escapeHtml(genre)}" value="${escapeHtml(genre)}">
                    <label for="genre_${escapeHtml(genre)}">${escapeHtml(genre)}</label>
                </div>
            `).join('');
            document.querySelectorAll('#genreList input').forEach(cb => {
                if (selectedGenres.includes(cb.value)) cb.checked = true;
            });
        }

        function populateFormatDropdown(formats) {
            const formatList = document.getElementById('formatList');
            if (!formatList) return;
            if (formats.length === 0) {
                formatList.innerHTML = '<div style="color: #999; text-align: center;">No formats available</div>';
                return;
            }
            formatList.innerHTML = formats.map(f => `
                <div class="filter-checkbox-item">
                    <input type="checkbox" id="format_${f.id}" value="${f.id}">
                    <label for="format_${f.id}">${escapeHtml(f.name)}</label>
                </div>
            `).join('');
            document.querySelectorAll('#formatList input').forEach(cb => {
                if (selectedFormatIds.includes(parseInt(cb.value))) cb.checked = true;
            });
        }

        function updateFilterUI() {
            const arrivalsBtn = document.getElementById('newArrivalsBtn');
            const vinylBtn = document.getElementById('newVinylBtn');
            
            if (newArrivalsActive) {
                arrivalsBtn.classList.add('active');
                arrivalsBtn.innerHTML = '<i class="fas fa-calendar-week"></i> New Arrivals';
            } else {
                arrivalsBtn.classList.remove('active');
                arrivalsBtn.innerHTML = '<i class="fas fa-list"></i> All Records';
            }
            
            if (newVinylActive) vinylBtn.classList.add('active');
            else vinylBtn.classList.remove('active');
            
            const filters = [];
            if (currentSearchTerm) filters.push(`Search: "${currentSearchTerm}"`);
            if (newArrivalsActive) filters.push(`New Arrivals (last 7 days)`);
            if (!newArrivalsActive) filters.push(`All Records`);
            if (newVinylActive) filters.push(`New Vinyl Only`);
            if (selectedGenres.length > 0) filters.push(`Genre: ${selectedGenres.join(', ')}`);
            if (selectedFormatIds.length > 0) {
                const formatNames = selectedFormatIds.map(id => getFormatName(id) || `Format ${id}`).join(', ');
                filters.push(`Format: ${formatNames}`);
            }
            
            const statusRow = document.getElementById('filterStatusRow');
            const summaryDiv = document.getElementById('filterSummary');
            
            if (filters.length === 0 && newArrivalsActive) {
                statusRow.style.display = 'flex';
                summaryDiv.innerHTML = `New Arrivals (last 7 days) <span class="result-count-badge">${allRecords.length} results</span>`;
            } else if (filters.length === 0 && !newArrivalsActive) {
                statusRow.style.display = 'flex';
                summaryDiv.innerHTML = `All Records <span class="result-count-badge">${allRecords.length} results</span>`;
            } else if (filters.length > 0) {
                statusRow.style.display = 'flex';
                summaryDiv.innerHTML = `${filters.join(' · ')} <span class="result-count-badge">${allRecords.length} results</span>`;
            } else {
                statusRow.style.display = 'none';
            }
        }

        function createRecordCard(record) {
            const card = document.createElement('div');
            card.className = 'record-card';
            
            const genre = extractGenreFromDiscogsRaw(record.discogs_genre_raw);
            const combinedCondition = getCombinedCondition(record.condition_disc_id, record.condition_sleeve_id);
            const formatName = getFormatName(record.format_id);
            
            const imageHtml = record.image_url ? 
                `<img src="${record.image_url}" alt="${record.title}" onerror="this.parentElement.classList.add('default-bg'); this.style.display='none';">` : '';
            
            let innerHtml = `
                <div class="record-card-image ${!record.image_url ? 'default-bg' : ''}">
                    ${imageHtml || '<i class="fas fa-music"></i>'}
                </div>
                <div class="record-card-info">
                    <div class="record-card-artist">${escapeHtml(record.artist)}</div>
                    <div class="record-card-title">${escapeHtml(record.title)}</div>
                    <div class="record-card-price">$${parseFloat(record.store_price).toFixed(2)}</div>
                    <div>
                        <span class="record-card-condition">${escapeHtml(combinedCondition)}</span>
                    </div>
            `;
            
            if (genre) {
                innerHtml += `<div class="record-card-genre"><i class="fas fa-music"></i> ${escapeHtml(genre)}</div>`;
            }
            
            if (formatName) {
                innerHtml += `<div class="record-card-format"><i class="fas fa-record-vinyl"></i> ${escapeHtml(formatName)}</div>`;
            }
            
            innerHtml += `</div>`;
            
            card.innerHTML = innerHtml;
            card.addEventListener('click', () => showRecordModal(record));
            return card;
        }

        function showRecordModal(record) {
            const genre = extractGenreFromDiscogsRaw(record.discogs_genre_raw);
            const discCondition = getConditionDisplayName(record.condition_disc_id);
            const sleeveCondition = getConditionDisplayName(record.condition_sleeve_id);
            const formatName = getFormatName(record.format_id);
            
            const modal = document.createElement('div');
            modal.className = 'record-modal-overlay';
            const imageHtml = record.image_url ? `<img src="${record.image_url}" alt="${record.title}">` : '<i class="fas fa-music" style="font-size: 64px;"></i>';
            
            let detailsHtml = `
                <div class="detail-row"><span class="detail-label">Disc:</span><span>${escapeHtml(discCondition)}</span></div>
                <div class="detail-row"><span class="detail-label">Sleeve:</span><span>${escapeHtml(sleeveCondition)}</span></div>
            `;
            if (genre) {
                detailsHtml += `<div class="detail-row"><span class="detail-label">Genre:</span><span>${escapeHtml(genre)}</span></div>`;
            }
            if (formatName) {
                detailsHtml += `<div class="detail-row"><span class="detail-label">Format:</span><span>${escapeHtml(formatName)}</span></div>`;
            }
            
            modal.innerHTML = `
                <div class="record-modal">
                    <div class="record-modal-header">
                        <h3>${escapeHtml(record.artist)}</h3>
                        <button class="record-modal-close">&times;</button>
                    </div>
                    <div class="record-modal-image ${!record.image_url ? 'default-bg' : ''}">${imageHtml}</div>
                    <div class="record-modal-info">
                        <div class="record-modal-title">${escapeHtml(record.title)}</div>
                        <div class="record-modal-details">
                            ${detailsHtml}
                        </div>
                        <div class="record-modal-price">$${parseFloat(record.store_price).toFixed(2)}</div>
                        <div class="record-modal-actions">
                            <button class="close-modal-btn">Close</button>
                        </div>
                    </div>
                </div>
            `;
            
            document.body.appendChild(modal);
            modal.querySelector('.record-modal-close').onclick = () => modal.remove();
            modal.querySelector('.close-modal-btn').onclick = () => modal.remove();
            modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
        }

        function escapeHtml(text) { 
            if(!text) return ''; 
            const div = document.createElement('div'); 
            div.textContent = text; 
            return div.innerHTML; 
        }
        
        function debounce(fn, delay) { 
            let t; 
            return function(...a){ 
                clearTimeout(t); 
                setTimeout(()=>fn(...a), delay); 
            }; 
        }
    </script>
</body>
</html>
