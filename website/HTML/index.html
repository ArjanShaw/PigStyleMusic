    <!-- Additional CSS for sticky notes and subscription modal -->
    <style>
        /* Sticky notes container */
        .sticky-notes-container {
            position: fixed;
            top: 80px;
            left: 20px;
            z-index: 1001;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 250px;
        }
        
        /* Individual sticky note styles */
        .sticky-note {
            background-color: #ffeb3b;
            color: #000;
            padding: 15px 20px;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            font-size: 1.2rem;
            font-weight: bold;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.3);
            transform: rotate(-2deg);
            border: 1px solid #e6c300;
            border-radius: 0 10px 10px 0;
            text-align: center;
            line-height: 1.4;
            word-wrap: break-word;
            position: relative;
            animation: float 3s ease-in-out infinite;
        }
        
        .sticky-note:nth-child(even) {
            transform: rotate(1deg);
            background-color: #fff176;
        }
        
        .sticky-note:nth-child(3n) {
            transform: rotate(-3deg);
            background-color: #fff59d;
        }
        
        .sticky-note::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0) 50%);
            pointer-events: none;
            border-radius: 0 10px 10px 0;
        }
        
        .sticky-note::after {
            content: '';
            position: absolute;
            bottom: -5px;
            right: -5px;
            width: 20px;
            height: 20px;
            background: rgba(0,0,0,0.1);
            transform: rotate(45deg);
            z-index: -1;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(-2deg); }
            50% { transform: translateY(-5px) rotate(-2deg); }
        }
        
        .sticky-note:nth-child(even) {
            animation: float-even 3s ease-in-out infinite;
        }
        
        .sticky-note:nth-child(3n) {
            animation: float-odd 3.5s ease-in-out infinite;
        }
        
        @keyframes float-even {
            0%, 100% { transform: translateY(0px) rotate(1deg); }
            50% { transform: translateY(-5px) rotate(1deg); }
        }
        
        @keyframes float-odd {
            0%, 100% { transform: translateY(0px) rotate(-3deg); }
            50% { transform: translateY(-5px) rotate(-3deg); }
        }
        
        @media (min-width: 769px) {
            .sticky-notes-container { display: flex; }
        }
        
        @media (max-width: 768px) {
            .sticky-notes-container { display: none; }
        }
        
        @media (min-width: 769px) and (max-width: 1024px) {
            .sticky-notes-container {
                top: 70px;
                left: 10px;
                max-width: 200px;
            }
            .sticky-note {
                padding: 10px 15px;
                font-size: 1rem;
            }
        }

        /* Subscription Modal Styles */
        .subscribe-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .subscribe-modal.active {
            display: flex;
        }

        .subscribe-modal-content {
            background: white;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
            max-height: 90%;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .subscribe-modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px 12px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .subscribe-modal-header h3 {
            margin: 0;
            font-size: 1.3rem;
        }

        .subscribe-modal-close {
            background: none;
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }

        .subscribe-modal-close:hover {
            opacity: 0.8;
        }

        .subscribe-modal-body {
            padding: 25px;
        }

        .subscribe-form-group {
            margin-bottom: 20px;
        }

        .subscribe-form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .subscribe-form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        .subscribe-form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .subscribe-form-hint {
            font-size: 12px;
            color: #666;
            margin-bottom: 20px;
            padding: 8px;
            background: #f8f9fa;
            border-radius: 4px;
        }

        .subscribe-submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .subscribe-submit-btn:hover {
            transform: translateY(-2px);
        }

        .subscribe-submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        body.modal-open {
            overflow: hidden;
        }

        /* ========== NAVBAR NOTIFICATION BELL STYLES ========== */
        #navbar-notification-container {
            position: relative;
            display: inline-block;
            margin-right: 10px;
        }

        #navbar-notification-container.hidden {
            display: none !important;
        }

        #navbar-notification-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
        }

        #navbar-notification-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        #navbar-notification-btn.has-notifications {
            border-color: #ff6b6b;
            background: rgba(255, 107, 107, 0.15);
        }

        #navbar-notification-badge {
            display: none;
            position: absolute;
            top: -6px;
            right: -6px;
            background: #dc3545;
            color: white;
            border-radius: 50%;
            padding: 1px 6px;
            font-size: 10px;
            font-weight: bold;
            min-width: 18px;
            text-align: center;
            line-height: 16px;
            animation: badge-pulse 2s infinite;
        }

        #navbar-notification-badge.show {

        }

        #navbar-notification-dropdown {
            display: none;
            position: absolute;
            top: 40px;
            right: 0;
            background: white;
            min-width: 380px;
            max-height: 450px;
            overflow-y: auto;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);

            border: 1px solid #ddd;
            z-index: 2000;
        }

        #navbar-notification-dropdown.show {
            display: block;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes badge-pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .navbar-notification-header {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8f9fa;

        .navbar-notification-header span {

        .navbar-notification-item {

        .navbar-notification-icon {

        .navbar-notification-footer {

        @media (max-width: 768px) {
            #navbar-notification-dropdown {

    </style>
     
    <script>
        // Load navbar component
        function loadNavbar() {
            fetch('/components/navbar.html')
                .then(response => response.text())
                .then(html => {
                    document.getElementById('navbar-placeholder').innerHTML = html;
                    initNotificationBell();
                    initSubscriptionModal();
                })
                .catch(error => {
                    console.error('Error loading navbar:', error);
                });
        }

        // Load subscription modal
        function loadSubscriptionModal() {
            fetch('/components/subscription-modal.html')
                .then(response => response.text())
                .then(html => {
                    document.getElementById('subscription-modal-placeholder').innerHTML = html;
                })
                .catch(error => {
                    console.error('Error loading subscription modal:', error);
                });
        }

        // ===== SUBSCRIPTION MODAL INITIALIZATION =====
        function initSubscriptionModal() {
            const subscribeLink = document.getElementById('subscribe-link');
            const subscribeModal = document.getElementById('subscribe-modal');
            const subscribeClose = document.querySelector('.subscribe-modal-close');
            const subscribeForm = document.getElementById('subscribe-form');
            const subscribeMessage = document.getElementById('subscribe-message');

            if (!subscribeLink || !subscribeModal) return;

            subscribeLink.addEventListener('click', function(e) {
                e.preventDefault();
                subscribeModal.style.display = 'flex';
                document.body.classList.add('modal-open');
            });

            if (subscribeClose) {
                subscribeClose.addEventListener('click', function() {
                    subscribeModal.style.display = 'none';
                    document.body.classList.remove('modal-open');
                    if (subscribeMessage) subscribeMessage.style.display = 'none';
                    if (subscribeForm) subscribeForm.reset();
                });
            }

            subscribeModal.addEventListener('click', function(e) {
                if (e.target === subscribeModal) {
                    subscribeModal.style.display = 'none';
                    document.body.classList.remove('modal-open');
                    if (subscribeMessage) subscribeMessage.style.display = 'none';
                    if (subscribeForm) subscribeForm.reset();
                }
            });

            if (subscribeForm) {
                subscribeForm.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    
                    const email = document.getElementById('subscribe-email').value.trim();
                    const artist = document.getElementById('subscribe-artist').value.trim();
                    const title = document.getElementById('subscribe-title').value.trim();
                    const catalog_number = document.getElementById('subscribe-catalog').value.trim();
                    
                    if (!artist && !title && !catalog_number) {
                        showSubscribeMessage('Please enter at least one search term (artist, title, or catalog number)', 'error');
                        return;
                    }
                    
                    if (!email || !email.includes('@') || !email.includes('.')) {
                        showSubscribeMessage('Please enter a valid email address', 'error');
                        return;
                    }
                    
                    const submitBtn = subscribeForm.querySelector('.subscribe-submit-btn');
                    submitBtn.disabled = true;
                    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Subscribing...';
                    
                    try {
                        const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
                        const apiUrl = isLocalhost 
                            ? 'http://localhost:5000/api/subscribe'
                            : `https://${window.location.hostname}/api/subscribe`;
                        
                        const response = await fetch(apiUrl, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Accept': 'application/json'
                            },
                            body: JSON.stringify({ email, artist, title, catalog_number })
                        });
                        
                        const data = await response.json();
                        
                        if (response.ok && data.status === 'success') {
                            showSubscribeMessage(data.already_subscribed ? data.message : 'Thank you for subscribing! We\'ll email you when matching records arrive.', data.already_subscribed ? 'info' : 'success');
                            subscribeForm.reset();
                            
                            setTimeout(() => {
                                subscribeModal.style.display = 'none';
                                document.body.classList.remove('modal-open');
                                if (subscribeMessage) subscribeMessage.style.display = 'none';
                            }, 3000);
                        } else {
                            showSubscribeMessage(data.error || 'Something went wrong. Please try again.', 'error');
                        }
                    } catch (error) {
                        console.error('Subscription error:', error);
                        showSubscribeMessage('Network error. Please try again.', 'error');
                    } finally {
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = '<i class="fas fa-bell"></i> Subscribe';
                    }
                });
            }

            function showSubscribeMessage(message, type) {
                if (!subscribeMessage) return;
                subscribeMessage.textContent = message;
                subscribeMessage.style.display = 'block';
                subscribeMessage.style.background = type === 'success' ? '#d4edda' : (type === 'info' ? '#cce5ff' : '#f8d7da');
                subscribeMessage.style.color = type === 'success' ? '#155724' : (type === 'info' ? '#004085' : '#721c24');
                subscribeMessage.style.border = type === 'success' ? '1px solid #c3e6cb' : (type === 'info' ? '1px solid #b8daff' : '1px solid #f5c6cb');
                subscribeMessage.style.borderRadius = '4px';
                subscribeMessage.style.padding = '12px';
                subscribeMessage.style.marginTop = '15px';
            }
        }

        // ===== NOTIFICATION BELL INITIALIZATION =====
        function initNotificationBell() {
            const notificationContainer = document.getElementById('navbar-notification-container');
            const notificationBadge = document.getElementById('navbar-notification-badge');
            const notificationBtn = document.getElementById('navbar-notification-btn');
            
            if (!notificationContainer || !notificationBtn) {
                console.warn('Notification bell elements not found');
                return;
            }

            async function checkLoginStatus() {
                try {
                    const response = await fetch('/session/check', {
                        credentials: 'include',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        }
                    });
                    
                    if (!response.ok) {
                        console.warn('Session check failed:', response.status);
                        return;
                    }
                    
                    const data = await response.json();
                    
                    if (data.logged_in) {
                        notificationContainer.classList.remove('hidden');
                        notificationContainer.style.display = 'inline-block';
                        checkNotifications();
                        if (window.notificationInterval) {
                            clearInterval(window.notificationInterval);
                        }
                        window.notificationInterval = setInterval(checkNotifications, 30000);
                    } else {
                        notificationContainer.classList.add('hidden');
                        notificationContainer.style.display = 'none';
                        if (window.notificationInterval) {
                            clearInterval(window.notificationInterval);
                            window.notificationInterval = null;
                        }
                        if (notificationBadge) {
                            notificationBadge.style.display = 'none';
                            notificationBadge.classList.remove('show');
                        }
                    }
                } catch (error) {
                    console.error('Error checking login status:', error);
                }
            }

            async function checkNotifications() {
                try {
                    if (notificationContainer.classList.contains('hidden')) {
                        return;
                    }
                    
                    const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
                    const apiUrl = isLocalhost 
                        ? 'http://localhost:5000/api/subscriptions/notifications/count'
                        : `https://${window.location.hostname}/api/subscriptions/notifications/count`;
                    
                    const response = await fetch(apiUrl, {
                        credentials: 'include',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        }
                    });
                    
                    if (!response.ok) return;
                    
                    const data = await response.json();
                    
                    if (data.status === 'success' && data.count > 0) {
                        if (notificationBadge) {
                            notificationBadge.textContent = data.count > 99 ? '99+' : data.count;
                            notificationBadge.style.display = 'block';
                            notificationBadge.classList.add('show');
                        }
                        if (notificationBtn) {
                            notificationBtn.classList.add('has-notifications');
                        }
                    } else {
                        if (notificationBadge) {
                            notificationBadge.style.display = 'none';
                            notificationBadge.classList.remove('show');
                        }
                        if (notificationBtn) {
                            notificationBtn.classList.remove('has-notifications');
                        }
                    }
                } catch (error) {
                    console.error('Error checking notifications:', error);
                }
            }

            async function loadNotifications() {
                try {
                    const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
                    const apiUrl = isLocalhost 
                        ? 'http://localhost:5000/api/subscriptions/notifications'
                        : `https://${window.location.hostname}/api/subscriptions/notifications`;
                    
                    const response = await fetch(apiUrl, {
                        credentials: 'include',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        }
                    });
                    
                    if (!response.ok) return;
                    
                    const data = await response.json();
                    const list = document.getElementById('navbar-notification-list');
                    
                    if (!list) return;
                    
                    if (data.status === 'success' && data.notifications && data.notifications.length > 0) {
                        let html = '';
                        data.notifications.forEach(n => {
                            const timeAgo = getTimeAgo(n.created_at);
                            html += `
                                <div class="navbar-notification-item unread" data-id="${n.id}">
                                    <div class="navbar-notification-icon">
                                        <i class="fas fa-envelope"></i>
                                    </div>
                                    <div class="navbar-notification-content">
                                        <div class="navbar-notification-email">${escapeHtml(n.email)}</div>
                                        <div class="navbar-notification-details">
                                            ${n.artist ? `Artist: ${escapeHtml(n.artist)}` : ''}
                                            ${n.title ? `Title: ${escapeHtml(n.title)}` : ''}
                                            ${n.catalog_number ? `Catalog: ${escapeHtml(n.catalog_number)}` : ''}
                                        </div>
                                        <div class="navbar-notification-time">${timeAgo}</div>
                                    </div>
                                    <button class="navbar-notification-mark-read" onclick="markNotificationRead(${n.id})">Mark Read</button>
                                </div>
                            `;
                        });
                        list.innerHTML = html;
                    } else {
                        list.innerHTML = `
                            <div class="navbar-notification-empty">
                                <i class="fas fa-bell-slash"></i>
                                No new notifications
                            </div>
                        `;
                    }
                } catch (error) {
                    console.error('Error loading notifications:', error);
                }
            }

            window.markNotificationRead = async function(id) {
                try {
                    const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
                    const apiUrl = isLocalhost 
                        ? `http://localhost:5000/api/subscriptions/${id}`
                        : `https://${window.location.hostname}/api/subscriptions/${id}`;
                    
                    await fetch(apiUrl, {
                        method: 'PUT',
                        credentials: 'include',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify({ mark_read: true })
                    });
                    
                    loadNotifications();
                    checkNotifications();
                } catch (error) {
                    console.error('Error marking notification read:', error);
                }
            };

            window.markAllNotificationsRead = async function() {
                try {
                    const items = document.querySelectorAll('.navbar-notification-item.unread');
                    const ids = [];
                    items.forEach(item => {
                        const id = parseInt(item.dataset.id);
                        if (id) ids.push(id);
                    });
                    
                    if (ids.length === 0) return;
                    
                    const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
                    for (const id of ids) {
                        const apiUrl = isLocalhost 
                            ? `http://localhost:5000/api/subscriptions/${id}`
                            : `https://${window.location.hostname}/api/subscriptions/${id}`;
                        
                        await fetch(apiUrl, {
                            method: 'PUT',
                            credentials: 'include',
                            headers: {
                                'Content-Type': 'application/json',
                                'Accept': 'application/json'
                            },
                            body: JSON.stringify({ mark_read: true })
                        });
                    }
                    
                    loadNotifications();
                    checkNotifications();
                } catch (error) {
                    console.error('Error marking all notifications read:', error);
                }
            };

            window.toggleNotificationDropdown = function() {
                const dropdown = document.getElementById('navbar-notification-dropdown');
                if (dropdown.classList.contains('show')) {
                    dropdown.classList.remove('show');
                } else {
                    dropdown.classList.add('show');
                    loadNotifications();
                }
            };

            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function getTimeAgo(dateStr) {
                if (!dateStr) return 'N/A';
                const date = new Date(dateStr);
                const now = new Date();
                const diffMs = now - date;
                const diffMins = Math.floor(diffMs / 60000);
                const diffHours = Math.floor(diffMs / 3600000);
                const diffDays = Math.floor(diffMs / 86400000);
                
                if (diffMins < 1) return 'Just now';
                if (diffMins < 60) return `${diffMins}m ago`;
                if (diffHours < 24) return `${diffHours}h ago`;
                if (diffDays < 7) return `${diffDays}d ago`;
                return date.toLocaleDateString();
            }

            if (notificationBtn) {
                notificationBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    toggleNotificationDropdown();
                });
            }

            document.addEventListener('click', function(e) {
                const container = document.getElementById('navbar-notification-container');
                if (container && !container.contains(e.target)) {
                    const dropdown = document.getElementById('navbar-notification-dropdown');
                    if (dropdown) {
                        dropdown.classList.remove('show');
                    }
                }
            });

            const markAllBtn = document.getElementById('navbar-mark-all-read');
            if (markAllBtn) {
                markAllBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    window.markAllNotificationsRead();
                });
            }

            function updateBellVisibility() {
                if (typeof Auth !== 'undefined' && Auth.isLoggedIn) {
                    notificationContainer.classList.remove('hidden');
                    notificationContainer.style.display = 'inline-block';
                    checkNotifications();
                    
                    if (window.notificationInterval) {
                        clearInterval(window.notificationInterval);
                    }
                    window.notificationInterval = setInterval(checkNotifications, 30000);
                } else if (typeof Auth !== 'undefined' && !Auth.isLoggedIn) {
                    notificationContainer.classList.add('hidden');
                    notificationContainer.style.display = 'none';
                    if (window.notificationInterval) {
                        clearInterval(window.notificationInterval);
                        window.notificationInterval = null;
                    }
                } else {
                    checkLoginStatus();
                }
            }

            updateBellVisibility();

            document.addEventListener('authStateChanged', function(e) {
                updateBellVisibility();
            });

            let authCheckAttempts = 0;
            const maxAuthChecks = 20;
            const authCheckInterval = setInterval(function() {
                authCheckAttempts++;
                if (typeof Auth !== 'undefined') {
                    clearInterval(authCheckInterval);
                    updateBellVisibility();
                } else if (authCheckAttempts >= maxAuthChecks) {
                    clearInterval(authCheckInterval);
                    checkLoginStatus();
                }
            }, 500);

            document.addEventListener('visibilitychange', function() {
                if (!document.hidden) {
                    updateBellVisibility();
                }
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            // Load navbar and subscription modal
            loadNavbar();
            loadSubscriptionModal();

            // Get all store images
            const storeImages = document.querySelectorAll('.store-front, .store-inside');
            const modal = document.querySelector('.expandable-modal');
            const expandedImg = document.querySelector('.expanded-image');
            const imageCaption = document.querySelector('.image-caption');
            const closeModal = document.querySelector('.close-modal');
            
            storeImages.forEach(img => {
                img.addEventListener('click', function() {
                    expandedImg.src = this.src;
                    imageCaption.textContent = this.alt;
                    modal.classList.add('active');
                    document.body.classList.add('modal-open');
                });
            });
            
            if (closeModal) {
                closeModal.addEventListener('click', function() {
                    modal.classList.remove('active');
                    document.body.classList.remove('modal-open');
                });
            }
            
            if (modal) {
                modal.addEventListener('click', function(e) {
                    if (e.target === modal) {
                        modal.classList.remove('active');
                        document.body.classList.remove('modal-open');
                    }
                });
            }
            
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && modal.classList.contains('active')) {
                    modal.classList.remove('active');
                    document.body.classList.remove('modal-open');
                }
            });

            // Fetch and display commission rate
            async function fetchCommissionRate() {
                try {
                    if (typeof AppConfig === 'undefined') {
                        console.warn('AppConfig not loaded yet, retrying...');
                        setTimeout(fetchCommissionRate, 500);
                        return;
                    }
                    
                    const apiUrl = AppConfig.getUrl('commissionRate');
                    const response = await fetch(apiUrl, {
                        method: 'GET',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        }
                    });
                    
                    if (!response.ok) {
                        throw new Error(`API returned ${response.status}: ${response.statusText}`);
                    }
                    
                    const data = await response.json();
                    
                    if (data && data.commission_rate_percent) {
                        const sellLineItem = document.getElementById('sell-records-line');
                        if (sellLineItem) {
                            sellLineItem.innerHTML = `Paying cash for vinyl records`;
                        }
                    } else {
                        throw new Error('Invalid response format: missing commission_rate_percent');
                    }
                    
                } catch (error) {
                    console.error('Error fetching commission rate:', error);
                    const sellLineItem = document.getElementById('sell-records-line');
                    if (sellLineItem) {
                        sellLineItem.innerHTML = `Sell your records for cash - Rate info currently unavailable`;
                    }
                }
            }

            // Fetch and display sticky notes
            async function fetchStickyNotes() {
                try {
                    const isLocalhost = window.location.hostname === 'localhost' || 
                                      window.location.hostname === '127.0.0.1';
                    const apiUrl = isLocalhost 
                        ? 'http://localhost:5000/api/sticky-notes'
                        : `https://${window.location.hostname}/api/sticky-notes`;
                    
                    const response = await fetch(apiUrl, {
                        method: 'GET',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        }
                    });
                    
                    if (!response.ok) {
                        throw new Error(`API returned ${response.status}`);
                    }
                    
                    const data = await response.json();
                    
                    if (data.status === 'success' && data.notes && data.notes.length > 0) {
                        let container = document.querySelector('.sticky-notes-container');
                        if (!container) {
                            container = document.createElement('div');
                            container.className = 'sticky-notes-container';
                            document.body.appendChild(container);
                        }
                        
                        container.innerHTML = '';
                        
                        data.notes.forEach(note => {
                            const noteElement = document.createElement('div');
                            noteElement.className = 'sticky-note';
                            noteElement.textContent = note.note_text;
                            container.appendChild(noteElement);
                        });
                    }
                    
                } catch (error) {
                    console.error('Error fetching sticky notes:', error);
                }
            }

            fetchCommissionRate();
            fetchStickyNotes();
        });
    </script>
</head>
