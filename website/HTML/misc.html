<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <link rel="icon" href="/static/images/PigStyle.ico">
    <title>Merchandise - PigStyle Records</title>
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-03HFDR9PV7"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-03HFDR9PV7');
    </script>
    
    <!-- CSS FILES -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/accessories.css">
    <link rel="stylesheet" href="/static/css/shared.css">
    
    <script src="/static/js/app-config.js"></script>
    <script src="/static/js/notification-bell.js"></script>
    <script src="/static/js/shared.js"></script>
    <script src="/static/js/merchandise-store.js"></script>
    
    <style>
        /* Background */
        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        
        .background-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .background-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
        }
        
        .catalog-container {
            max-width: 1400px;
            margin: 80px auto 40px;
            padding: 20px;
            min-height: 400px;
        }
        
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #ccc;
        }
        
        .loading-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
        }
        
        .loading-dots div {
            width: 12px;
            height: 12px;
            background: #ff6b6b;
            border-radius: 50%;
            animation: bounce 0.5s ease-in-out infinite;
        }
        
        .loading-dots div:nth-child(1) { animation-delay: 0s; }
        .loading-dots div:nth-child(2) { animation-delay: 0.1s; }
        .loading-dots div:nth-child(3) { animation-delay: 0.2s; }
        .loading-dots div:nth-child(4) { animation-delay: 0.3s; }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        /* Navbar styles for misc page */
        nav {
            background: #000;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            border-bottom: 2px solid #ff6b6b;
        }
        
        nav a {
            color: white;
            text-decoration: none;
        }
        
        nav > a {
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        nav > a img {
            height: 30px;
            width: 30px;
        }
        
        nav > div {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        
        .notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 20px;
            border-radius: 8px;
            z-index: 3500;
            color: white;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <!-- Background -->
    <div class="background-container">
        <img src="/static/images/background.png" alt="Background" class="background-image">
        <div class="background-overlay"></div>
    </div>
    
    <!-- ===== NAVBAR PLACEHOLDER ===== -->
    <div id="navbar-placeholder"></div>
    
    <!-- ===== SUBSCRIPTION MODAL PLACEHOLDER ===== -->
    <div id="subscription-modal-placeholder"></div>

    <div class="catalog-container" id="catalogContainer">
        <div class="loading">
            <div class="loading-dots">
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>
            <p>Loading merchandise...</p>
        </div>
    </div>

    <script>
        // Load navbar and subscription modal from shared components
        document.addEventListener('DOMContentLoaded', function() {
            // Load navbar from shared component
            if (typeof loadNavbar === 'function') {
                loadNavbar();
            } else {
                console.warn('loadNavbar function not found, make sure shared.js is loaded');
            }
            
            // Load subscription modal from shared component
            if (typeof loadSubscriptionModal === 'function') {
                loadSubscriptionModal();
            } else {
                console.warn('loadSubscriptionModal function not found, make sure shared.js is loaded');
            }
            
            // Initialize subscription modal
            if (typeof initSubscriptionModal === 'function') {
                initSubscriptionModal();
            }
        });
    </script>
</body>
</html>
