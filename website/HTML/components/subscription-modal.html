<!-- html/components/subscription-modal.html -->
<div id="subscribe-modal" class="subscribe-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; justify-content: center; align-items: center;">
    <div class="subscribe-modal-content" style="background: white; border-radius: 12px; max-width: 500px; width: 90%; max-height: 90%; overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,0.3);">
        <div class="subscribe-modal-header" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; border-radius: 12px 12px 0 0; display: flex; justify-content: space-between; align-items: center;">
            <h3 style="margin: 0; font-size: 1.3rem;"><i class="fas fa-bell"></i> Get Notified When We Get Records You Want!</h3>
            <button class="subscribe-modal-close" style="background: none; border: none; color: white; font-size: 28px; cursor: pointer; padding: 0; line-height: 1;">&times;</button>
        </div>
        <div class="subscribe-modal-body" style="padding: 25px;">
            <p>Enter your email and what you're looking for. We'll email you when matching records arrive!</p>
            
            <form id="subscribe-form">
                <div class="subscribe-form-group" style="margin-bottom: 20px;">
                    <label for="subscribe-email" style="display: block; margin-bottom: 8px; font-weight: 600; color: #333;"><i class="fas fa-envelope"></i> Your Email *</label>
                    <input type="email" id="subscribe-email" required placeholder="you@example.com" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; box-sizing: border-box;">
                </div>
                
                <div class="subscribe-form-group" style="margin-bottom: 20px;">
                    <label for="subscribe-artist" style="display: block; margin-bottom: 8px; font-weight: 600; color: #333;"><i class="fas fa-microphone"></i> Artist</label>
                    <input type="text" id="subscribe-artist" placeholder="e.g., Bruce Springsteen" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; box-sizing: border-box;">
                </div>
                
                <div class="subscribe-form-group" style="margin-bottom: 20px;">
                    <label for="subscribe-title" style="display: block; margin-bottom: 8px; font-weight: 600; color: #333;"><i class="fas fa-music"></i> Album Title</label>
                    <input type="text" id="subscribe-title" placeholder="e.g., Born to Run" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; box-sizing: border-box;">
                </div>
                
                <div class="subscribe-form-group" style="margin-bottom: 20px;">
                    <label for="subscribe-catalog" style="display: block; margin-bottom: 8px; font-weight: 600; color: #333;"><i class="fas fa-barcode"></i> Catalog Number</label>
                    <input type="text" id="subscribe-catalog" placeholder="e.g., JC 33795" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; box-sizing: border-box;">
                </div>
                
                <div class="subscribe-form-hint" style="font-size: 12px; color: #666; margin-bottom: 20px; padding: 8px; background: #f8f9fa; border-radius: 4px;">
                    <i class="fas fa-info-circle"></i> Enter at least one search term (artist, title, or catalog number)
                </div>
                
                <button type="submit" class="subscribe-submit-btn" style="width: 100%; padding: 14px; background: linear-gradient(135deg, #28a745 0%, #20c997 100%); color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: transform 0.2s;">
                    <i class="fas fa-bell"></i> Subscribe
                </button>
            </form>
            
            <div id="subscribe-message" style="display: none;"></div>
        </div>
    </div>
</div>
