<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>PigStyle Music | Connect With Us</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* ===== FULL-PAGE WRAPPER ===== */
        .engagement-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-color: #0a0618;
        }

        /* ===== SLIDES CONTAINER ===== */
        .slides-container {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: flex;
            transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ===== INDIVIDUAL SLIDES ===== */
        .slide {
            flex: 0 0 100%;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        /* ===== BOTH SLIDES WITH background.png ===== */
        .slide[data-slide="review"],
        .slide[data-slide="email"] {
            background-image: url('/images/background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #0a0618;
        }

        /* ===== REVIEW SLIDE: pig_leaving_a_review.png ===== */
        .slide[data-slide="review"]::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url('/images/pig_leaving_a_review.png');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 0;
            opacity: 1;
        }

        /* ===== EMAIL SLIDE: pig_shooting_from_cannon.png ===== */
        .slide[data-slide="email"]::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url('/images/pig_shooting_from_cannon.png');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 0;
            opacity: 1;
        }

        /* ===== DARK OVERLAY FOR BOTH SLIDES ===== */
        .slide[data-slide="review"]::before,
        .slide[data-slide="email"]::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(10, 6, 24, 0.35);
            z-index: 1;
        }

        .slide[data-slide="review"] .slide-content,
        .slide[data-slide="email"] .slide-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            max-width: 520px;
            margin-bottom: 25vh;
        }

        /* ===== SLIDE BUTTON - DOUBLE SIZE ===== */
        .slide-btn {
            padding: 32px 80px;
            border: none;
            border-radius: 60px;
            font-size: 32px;
            font-weight: 800;
            font-family: 'Inter', sans-serif;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            display: inline-flex;
            align-items: center;
            gap: 18px;
            box-shadow: 0 12px 50px rgba(0, 0, 0, 0.5);
            letter-spacing: 0.5px;
        }

        .slide-btn:hover {
            transform: translateY(-4px) scale(1.03);
        }
        .slide-btn:active {
            transform: scale(0.96);
        }

        .slide-btn i {
            font-size: 34px;
        }

        .slide-btn.review-btn {
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            box-shadow: 0 12px 50px rgba(26, 115, 232, 0.5);
        }
        .slide-btn.review-btn:hover {
            box-shadow: 0 16px 60px rgba(26, 115, 232, 0.6);
        }

        .slide-btn.email-btn {
            background: linear-gradient(135deg, #2d1b69, #6d4fc6);
            box-shadow: 0 12px 50px rgba(45, 27, 105, 0.6);
        }
        .slide-btn.email-btn:hover {
            box-shadow: 0 16px 60px rgba(45, 27, 105, 0.7);
        }

        /* ===== DOT INDICATORS ===== */
        .dots {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 5;
        }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transition: all 0.4s ease;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .dot.active {
            background: #6d4fc6;
            box-shadow: 0 0 20px rgba(109, 79, 198, 0.5);
            width: 28px;
            border-radius: 6px;
        }
        .dot:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        /* ===== BRAND WATERMARK ===== */
        .brand-watermark {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.12);
            letter-spacing: 2px;
            text-transform: uppercase;
            z-index: 2;
            white-space: nowrap;
            pointer-events: none;
        }

        /* ===== MODAL OVERLAY ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 10;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* ===== MODAL CONTAINER ===== */
        .modal-container {
            position: relative;
            max-width: 480px;
            width: 100%;
            max-height: 90vh;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;
            padding: 40px 32px 36px;
            text-align: center;
            color: #fff;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
            animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ===== CLOSE BUTTON ===== */
        .modal-close {
            position: absolute;
            top: 16px;
            right: 20px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            font-size: 28px;
            cursor: pointer;
            transition: color 0.3s ease;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            padding: 4px 8px;
            line-height: 1;
        }

        .modal-close:hover {
            color: #fff;
        }

        /* ===== MODAL TITLE ===== */
        .modal-title {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff 40%, #b8a5e0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .modal-subtitle {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .modal-subtitle strong {
            color: #fff;
            font-weight: 600;
        }

        /* ===== MODAL FORM ELEMENTS ===== */
        .modal-email-input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .modal-email-input-wrapper {
            position: relative;
            width: 100%;
        }
        .modal-email-input-wrapper .fa-envelope {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.3);
            font-size: 16px;
        }

        .modal-email-input {
            width: 100%;
            padding: 14px 14px 14px 44px;
            border: 2px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            outline: none;
            -webkit-appearance: none;
        }
        .modal-email-input::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }
        .modal-email-input:focus {
            border-color: #6d4fc6;
            box-shadow: 0 0 0 4px rgba(109, 79, 198, 0.2);
        }
        .modal-email-input.error {
            border-color: #dc3545;
            box-shadow: 0 0 0 4px rgba(220, 53, 69, 0.2);
        }
        .modal-email-input.success {
            border-color: #28a745;
            box-shadow: 0 0 0 4px rgba(40, 167, 69, 0.2);
        }

        /* ===== MODAL BUTTONS ===== */
        .modal-btn-primary {
            width: 100%;
            padding: 16px 20px;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #fff;
            background: linear-gradient(135deg, #2d1b69, #6d4fc6);
            box-shadow: 0 8px 30px rgba(45, 27, 105, 0.4);
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            min-height: 54px;
        }

        .modal-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(45, 27, 105, 0.5);
        }
        .modal-btn-primary:active {
            transform: scale(0.97);
        }

        .modal-btn-secondary {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            font-weight: 400;
            cursor: pointer;
            padding: 8px 12px;
            transition: color 0.3s ease;
            font-family: 'Inter', sans-serif;
            margin-top: 8px;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .modal-btn-secondary:hover {
            color: rgba(255, 255, 255, 0.7);
        }

        /* ===== MODAL STATUS MESSAGES ===== */
        .modal-status-msg {
            font-size: 14px;
            padding: 6px 10px;
            border-radius: 10px;
            min-height: 20px;
            transition: all 0.3s ease;
            margin-top: 2px;
        }
        .modal-status-msg.success {
            color: #7ddfa0;
        }
        .modal-status-msg.error {
            color: #f8717a;
        }
        .modal-status-msg.info {
            color: #93c5fd;
        }
        .modal-status-msg.loading {
            color: rgba(255, 255, 255, 0.6);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .slide-btn {
                padding: 24px 50px;
                font-size: 24px;
                border-radius: 50px;
            }
            .slide-btn i {
                font-size: 26px;
            }
            .slide[data-slide="review"] .slide-content,
            .slide[data-slide="email"] .slide-content {
                margin-bottom: 22vh;
            }
            .modal-container {
                padding: 32px 20px 28px;
                border-radius: 24px;
                max-width: 400px;
            }
            .dots {
                bottom: 28px;
                gap: 10px;
            }
            .dot {
                width: 8px;
                height: 8px;
            }
            .dot.active {
                width: 24px;
            }
            .brand-watermark {
                bottom: 60px;
                font-size: 10px;
            }
            .modal-title {
                font-size: 24px;
            }
        }

        @media (max-width: 480px) {
            .slide-btn {
                padding: 18px 36px;
                font-size: 18px;
                border-radius: 40px;
            }
            .slide-btn i {
                font-size: 20px;
                gap: 12px;
            }
            .slide[data-slide="review"] .slide-content,
            .slide[data-slide="email"] .slide-content {
                margin-bottom: 20vh;
            }
            .modal-container {
                padding: 24px 16px 20px;
                border-radius: 20px;
                max-width: 100%;
            }
            .dots {
                bottom: 20px;
                gap: 8px;
            }
            .dot {
                width: 6px;
                height: 6px;
            }
            .dot.active {
                width: 20px;
            }
            .brand-watermark {
                bottom: 48px;
                font-size: 9px;
            }
            .modal-title {
                font-size: 22px;
            }
            .modal-subtitle {
                font-size: 14px;
            }
            .modal-btn-primary {
                font-size: 15px;
                padding: 12px 16px;
                min-height: 46px;
                border-radius: 12px;
            }
            .modal-email-input {
                font-size: 14px;
                padding: 12px 12px 12px 40px;
                border-radius: 12px;
            }
        }

        @media (orientation: landscape) and (max-height: 500px) {
            .slide-btn {
                padding: 16px 40px;
                font-size: 20px;
                border-radius: 40px;
            }
            .slide-btn i {
                font-size: 22px;
            }
            .slide[data-slide="review"] .slide-content,
            .slide[data-slide="email"] .slide-content {
                margin-bottom: 18vh;
            }
            .dots {
                bottom: 14px;
            }
            .brand-watermark {
                bottom: 36px;
            }
            .modal-container {
                padding: 20px 24px;
                max-width: 440px;
                max-height: 85vh;
            }
            .modal-title {
                font-size: 22px;
            }
            .modal-subtitle {
                font-size: 13px;
                margin-bottom: 16px;
            }
            .modal-email-input {
                padding: 10px 10px 10px 38px;
                font-size: 14px;
            }
            .modal-btn-primary {
                padding: 10px 14px;
                min-height: 40px;
                font-size: 14px;
            }
        }

        /* ===== SAFE AREA PADDING (iOS) ===== */
        @supports (padding: env(safe-area-inset-bottom)) {
            .engagement-wrapper {
                padding-bottom: env(safe-area-inset-bottom);
            }
            .dots {
                bottom: calc(40px + env(safe-area-inset-bottom));
            }
            .brand-watermark {
                bottom: calc(80px + env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>

    <div class="engagement-wrapper" id="engagementWrapper">

        <!-- Slides Container -->
        <div class="slides-container" id="slidesContainer">
            <!-- SLIDE 1: Google Review -->
            <div class="slide" data-slide="review">
                <div class="slide-content">
                    <button class="slide-btn review-btn" id="reviewDirectBtn">
                        <i class="fab fa-google"></i> Write a Review
                    </button>
                </div>
            </div>

            <!-- SLIDE 2: Email Newsletter -->
            <div class="slide" data-slide="email">
                <div class="slide-content">
                    <button class="slide-btn email-btn" id="emailOpenBtn">
                        <i class="fas fa-paper-plane"></i> Subscribe
                    </button>
                </div>
            </div>
        </div>

        <!-- Dot Indicators -->
        <div class="dots" id="dotsContainer">
            <span class="dot active" data-slide="0"></span>
            <span class="dot" data-slide="1"></span>
        </div>

        <!-- Brand Watermark -->
        <div class="brand-watermark">PigStyle Music</div>

        <!-- ===== MODAL OVERLAY (Email Only) ===== -->
        <div class="modal-overlay" id="modalOverlay">
            <div class="modal-container" id="modalContainer">

                <!-- Close Button -->
                <button class="modal-close" id="closeModalBtn">
                    <i class="fas fa-times"></i>
                </button>

                <!-- Modal Content -->
                <div id="modalContent">
                    <div style="text-align: center;">
                        <div style="font-size: 48px; margin-bottom: 12px;">
                            <i class="fas fa-envelope-open-text"></i>
                        </div>
                        <h2 class="modal-title">Join Our Email List</h2>
                        <p class="modal-subtitle">
                            Stay updated on <strong>new arrivals, events,</strong> and <strong>special offers</strong>.<br />
                            No spam, unsubscribe anytime.
                        </p>
                        <div class="modal-email-input-group">
                            <div class="modal-email-input-wrapper">
                                <i class="fas fa-envelope"></i>
                                <input type="email" class="modal-email-input" id="modalEmailInput"
                                       placeholder="Enter your email" autocomplete="email" />
                            </div>
                            <button class="modal-btn-primary" id="modalSubscribeBtn">
                                <i class="fas fa-paper-plane"></i> Subscribe
                            </button>
                            <div id="modalEmailStatus" class="modal-status-msg"></div>
                        </div>
                        <button class="modal-btn-secondary" id="modalSkipEmailBtn">No thanks, maybe later</button>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <script>
        (function() {
            'use strict';

            // ===== CONFIG =====
            const API_BASE = window.location.hostname === 'localhost' ||
                window.location.hostname === '127.0.0.1' ?
                'http://localhost:5000' :
                'https://www.pigstylemusic.com';

            // ===== DIRECT GOOGLE REVIEW URL WITH CORRECT PLACE ID =====
            const GOOGLE_REVIEW_URL =
                'https://search.google.com/local/writereview?placeid=ChIJ-eRIn_ZTaYcRsr7PcilT3dg';

            const SLIDE_INTERVAL = 6000;

            // ===== DOM REFS =====
            const slidesContainer = document.getElementById('slidesContainer');
            const dots = document.querySelectorAll('.dot');
            const reviewDirectBtn = document.getElementById('reviewDirectBtn');
            const emailOpenBtn = document.getElementById('emailOpenBtn');
            const modalOverlay = document.getElementById('modalOverlay');
            const modalContainer = document.getElementById('modalContainer');
            const closeModalBtn = document.getElementById('closeModalBtn');
            const modalEmailInput = document.getElementById('modalEmailInput');
            const modalEmailStatus = document.getElementById('modalEmailStatus');
            const modalSubscribeBtn = document.getElementById('modalSubscribeBtn');
            const modalSkipEmailBtn = document.getElementById('modalSkipEmailBtn');

            let currentSlide = 0;
            let autoSlideTimer = null;
            let isTransitioning = false;

            // ===== GO TO SLIDE =====
            function goToSlide(index) {
                if (isTransitioning || index === currentSlide) return;
                isTransitioning = true;

                currentSlide = index;
                slidesContainer.style.transform = `translateX(-${index * 100}%)`;

                dots.forEach((dot, i) => {
                    dot.classList.toggle('active', i === index);
                });

                resetAutoSlide();

                setTimeout(() => {
                    isTransitioning = false;
                }, 700);
            }

            // ===== RESET AUTO SLIDE =====
            function resetAutoSlide() {
                if (autoSlideTimer) {
                    clearInterval(autoSlideTimer);
                    autoSlideTimer = null;
                }
                autoSlideTimer = setInterval(() => {
                    const next = (currentSlide + 1) % 2;
                    goToSlide(next);
                }, SLIDE_INTERVAL);
            }

            // ===== DOT CLICKS =====
            dots.forEach((dot, index) => {
                dot.addEventListener('click', function(e) {
                    e.stopPropagation();
                    goToSlide(index);
                });
                dot.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                    goToSlide(index);
                }, { passive: false });
            });

            // ===== REVIEW BUTTON - GO DIRECTLY TO GOOGLE REVIEW FORM =====
            reviewDirectBtn.addEventListener('click', function(e) {
                e.preventDefault();
                window.open(GOOGLE_REVIEW_URL, '_blank', 'noopener,noreferrer');
                // Visual feedback
                this.innerHTML = '<i class="fas fa-check-circle"></i> Thank You!';
                this.style.background = 'linear-gradient(135deg, #28a745, #1a7a34)';
                setTimeout(() => {
                    this.innerHTML = '<i class="fab fa-google"></i> Write a Review';
                    this.style.background = '';
                }, 3000);
            });

            // ===== EMAIL BUTTON - OPEN MODAL =====
            emailOpenBtn.addEventListener('click', function(e) {
                e.preventDefault();
                openModal();
            });

            // ===== MODAL FUNCTIONS =====
            function openModal() {
                modalOverlay.classList.add('active');
                document.body.style.overflow = 'hidden';
                if (autoSlideTimer) {
                    clearInterval(autoSlideTimer);
                    autoSlideTimer = null;
                }
                setTimeout(() => {
                    modalEmailInput.focus();
                }, 300);
            }

            function closeModal() {
                modalOverlay.classList.remove('active');
                document.body.style.overflow = '';
                resetAutoSlide();
                modalEmailInput.classList.remove('error', 'success');
                modalEmailStatus.textContent = '';
                modalEmailStatus.className = 'modal-status-msg';
                modalSubscribeBtn.disabled = false;
                modalSubscribeBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Subscribe';
            }

            // ===== CLOSE MODAL =====
            closeModalBtn.addEventListener('click', closeModal);
            modalOverlay.addEventListener('click', function(e) {
                if (e.target === modalOverlay) {
                    closeModal();
                }
            });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
                    closeModal();
                }
            });

            // ===== MODAL SKIP =====
            modalSkipEmailBtn.addEventListener('click', function(e) {
                e.preventDefault();
                closeModal();
            });

            // ===== MODAL EMAIL SUBSCRIPTION =====
            async function modalSubscribeEmail() {
                const email = modalEmailInput.value.trim();
                modalEmailStatus.className = 'modal-status-msg';

                if (!email) {
                    modalEmailStatus.textContent = '⚠️ Please enter your email';
                    modalEmailStatus.className = 'modal-status-msg error';
                    modalEmailInput.classList.add('error');
                    return;
                }
                if (!email.includes('@') || !email.includes('.')) {
                    modalEmailStatus.textContent = '⚠️ Please enter a valid email';
                    modalEmailStatus.className = 'modal-status-msg error';
                    modalEmailInput.classList.add('error');
                    return;
                }

                modalEmailInput.classList.remove('error');
                modalEmailStatus.textContent = '⏳ Subscribing...';
                modalEmailStatus.className = 'modal-status-msg loading';
                modalSubscribeBtn.disabled = true;
                modalSubscribeBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Subscribing...';

                try {
                    const response = await fetch(`${API_BASE}/api/email-list/subscribe`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email })
                    });

                    const contentType = response.headers.get('content-type') || '';
                    if (!contentType.includes('application/json')) {
                        const text = await response.text();
                        console.error('Non-JSON response:', text.substring(0, 200));
                        throw new Error('Server returned non-JSON response');
                    }

                    const data = await response.json();

                    if (data.status === 'success') {
                        if (data.already_subscribed) {
                            modalEmailStatus.textContent = '📧 You\'re already subscribed!';
                            modalEmailStatus.className = 'modal-status-msg info';
                            modalEmailInput.classList.add('success');
                        } else {
                            modalEmailStatus.textContent = '✅ Subscribed! Check your email for updates.';
                            modalEmailStatus.className = 'modal-status-msg success';
                            modalEmailInput.value = '';
                            modalEmailInput.classList.add('success');
                            setTimeout(closeModal, 2000);
                        }
                    } else {
                        modalEmailStatus.textContent = '❌ ' + (data.error || 'Failed to subscribe');
                        modalEmailStatus.className = 'modal-status-msg error';
                        modalEmailInput.classList.add('error');
                    }
                } catch (err) {
                    console.error('Email subscribe error:', err);
                    if (err.message.includes('404')) {
                        modalEmailStatus.textContent = '❌ Server endpoint not found. Please try again later.';
                    } else {
                        modalEmailStatus.textContent = '❌ Network error. Please try again.';
                    }
                    modalEmailStatus.className = 'modal-status-msg error';
                    modalEmailInput.classList.add('error');
                } finally {
                    modalSubscribeBtn.disabled = false;
                    modalSubscribeBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Subscribe';
                }
            }

            modalSubscribeBtn.addEventListener('click', function(e) {
                e.preventDefault();
                modalSubscribeEmail();
            });

            modalEmailInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    modalSubscribeEmail();
                }
            });

            modalEmailInput.addEventListener('input', function() {
                this.classList.remove('error', 'success');
                if (modalEmailStatus.textContent && !modalEmailStatus.textContent.includes('✅') &&
                    !modalEmailStatus.textContent.includes('📧')) {
                    modalEmailStatus.textContent = '';
                    modalEmailStatus.className = 'modal-status-msg';
                }
            });

            // ===== TOUCH SWIPE SUPPORT =====
            let touchStartX = 0;
            let touchEndX = 0;
            let touchStartY = 0;
            let touchEndY = 0;

            document.addEventListener('touchstart', function(e) {
                touchStartX = e.changedTouches[0].screenX;
                touchStartY = e.changedTouches[0].screenY;
            }, { passive: true });

            document.addEventListener('touchend', function(e) {
                touchEndX = e.changedTouches[0].screenX;
                touchEndY = e.changedTouches[0].screenY;
                const dx = touchEndX - touchStartX;
                const dy = touchEndY - touchStartY;
                if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
                    e.preventDefault();
                    if (dx < 0 && currentSlide === 0) {
                        goToSlide(1);
                    } else if (dx > 0 && currentSlide === 1) {
                        goToSlide(0);
                    }
                }
            }, { passive: false });

            // ===== START =====
            resetAutoSlide();

            console.log('📧 Email list API base:', API_BASE);
            console.log('⭐ Google Review URL:', GOOGLE_REVIEW_URL);

        })();
    </script>

</body>
</html>
