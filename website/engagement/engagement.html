<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>PigStyle Music | Connect With Us</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            -webkit-box-sizing: border-box;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
            -ms-touch-action: manipulation;
            touch-action: manipulation;
            background-color: #0a0618;
        }

        /* ===== FULL-PAGE WRAPPER ===== */
        .engagement-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0a0618;
        }

        /* ===== SLIDES CONTAINER ===== */
        .slides-container {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: -webkit-box;
            display: -webkit-flex;
            display: -ms-flexbox;
            display: flex;
            -webkit-transition: -webkit-transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
            transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ===== INDIVIDUAL SLIDES ===== */
        .slide {
            -webkit-box-flex: 0;
            -webkit-flex: 0 0 100%;
            -ms-flex: 0 0 100%;
            flex: 0 0 100%;
            width: 100%;
            height: 100%;
            display: -webkit-box;
            display: -webkit-flex;
            display: -ms-flexbox;
            display: flex;
            -webkit-box-align: end;
            -webkit-align-items: flex-end;
            -ms-flex-align: end;
            align-items: flex-end;
            -webkit-box-pack: center;
            -webkit-justify-content: center;
            -ms-flex-pack: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
            background-color: #0a0618;
        }

        /* ===== REVIEW SLIDE: pig_leaving_a_review.png ===== */
        .slide[data-slide="review"] .slide-pig {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            background-image: url('/images/pig_leaving_a_review.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 0;
            opacity: 1;
        }

        /* ===== EMAIL SLIDE: pig_shooting_from_cannon.png ===== */
        .slide[data-slide="email"] .slide-pig {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            background-image: url('/images/pig_shooting_from_cannon.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 0;
            opacity: 1;
        }

        /* ===== DARK OVERLAY FOR BOTH SLIDES ===== */
        .slide .slide-overlay {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            background: rgba(10, 6, 24, 0.35);
            z-index: 1;
        }

        .slide .slide-content {
            position: relative;
            z-index: 2;
            display: -webkit-box;
            display: -webkit-flex;
            display: -ms-flexbox;
            display: flex;
            -webkit-box-orient: vertical;
            -webkit-box-direction: normal;
            -webkit-flex-direction: column;
            -ms-flex-direction: column;
            flex-direction: column;
            -webkit-box-align: center;
            -webkit-align-items: center;
            -ms-flex-align: center;
            align-items: center;
            -webkit-box-pack: center;
            -webkit-justify-content: center;
            -ms-flex-pack: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            max-width: 520px;
            margin-bottom: 25vh;
        }

        /* ===== SLIDE BUTTON ===== */
        .slide-btn {
            padding: 32px 80px;
            border: none;
            border-radius: 60px;
            font-size: 32px;
            font-weight: 800;
            font-family: 'Inter', sans-serif;
            color: #fff;
            cursor: pointer;
            -webkit-transition: all 0.3s ease;
            transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent;
            -ms-touch-action: manipulation;
            touch-action: manipulation;
            display: inline-block;
            box-shadow: 0 12px 50px rgba(0, 0, 0, 0.5);
            letter-spacing: 0.5px;
            -webkit-appearance: none;
            appearance: none;
        }

        .slide-btn i {
            font-size: 34px;
            margin-right: 18px;
            vertical-align: middle;
        }

        .slide-btn span {
            vertical-align: middle;
        }

        .slide-btn.review-btn {
            background: #1a73e8;
            background: -webkit-linear-gradient(315deg, #1a73e8, #0d47a1);
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            box-shadow: 0 12px 50px rgba(26, 115, 232, 0.5);
        }

        .slide-btn.email-btn {
            background: #2d1b69;
            background: -webkit-linear-gradient(315deg, #2d1b69, #6d4fc6);
            background: linear-gradient(135deg, #2d1b69, #6d4fc6);
            box-shadow: 0 12px 50px rgba(45, 27, 105, 0.6);
        }

        .slide-btn:active {
            -webkit-transform: scale(0.96);
            transform: scale(0.96);
        }

        /* ===== DOT INDICATORS ===== */
        .dots {
            position: absolute;
            bottom: 40px;
            left: 50%;
            -webkit-transform: translateX(-50%);
            -ms-transform: translateX(-50%);
            transform: translateX(-50%);
            display: block;
            z-index: 5;
        }

        .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            -webkit-transition: all 0.4s ease;
            transition: all 0.4s ease;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            -ms-touch-action: manipulation;
            touch-action: manipulation;
            margin: 0 6px;
            vertical-align: middle;
        }

        .dot.active {
            background: #6d4fc6;
            box-shadow: 0 0 20px rgba(109, 79, 198, 0.5);
            width: 28px;
            border-radius: 6px;
        }

        /* ===== BRAND WATERMARK ===== */
        .brand-watermark {
            position: absolute;
            bottom: 80px;
            left: 50%;
            -webkit-transform: translateX(-50%);
            -ms-transform: translateX(-50%);
            transform: translateX(-50%);
            font-size: 12px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.12);
            letter-spacing: 2px;
            text-transform: uppercase;
            z-index: 2;
            white-space: nowrap;
            pointer-events: none;
        }

        /* ===== MODAL OVERLAY ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 10;
            display: none;
            -webkit-box-align: center;
            -webkit-align-items: center;
            -ms-flex-align: center;
            align-items: center;
            -webkit-box-pack: center;
            -webkit-justify-content: center;
            -ms-flex-pack: center;
            justify-content: center;
            padding: 20px;
            -webkit-animation: fadeIn 0.3s ease;
            animation: fadeIn 0.3s ease;
        }

        .modal-overlay.active {
            display: -webkit-box;
            display: -webkit-flex;
            display: -ms-flexbox;
            display: flex;
        }

        @-webkit-keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* ===== MODAL CONTAINER ===== */
        .modal-container {
            position: relative;
            max-width: 480px;
            width: 100%;
            max-height: 90%;
            background: #1a1230;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;
            padding: 40px 32px 36px;
            text-align: center;
            color: #fff;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
            -webkit-animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        @-webkit-keyframes slideUp {
            from { opacity: 0; -webkit-transform: translateY(40px) scale(0.95); }
            to { opacity: 1; -webkit-transform: translateY(0) scale(1); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ===== CLOSE BUTTON ===== */
        .modal-close {
            position: absolute;
            top: 16px;
            right: 20px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            font-size: 28px;
            cursor: pointer;
            -webkit-transition: color 0.3s ease;
            transition: color 0.3s ease;
            -webkit-tap-highlight-color: transparent;
            -ms-touch-action: manipulation;
            touch-action: manipulation;
            padding: 4px 8px;
            line-height: 1;
            -webkit-appearance: none;
            appearance: none;
        }

        /* ===== MODAL TITLE ===== */
        .modal-title {
            font-size: 28px;
            font-weight: 900;
            color: #fff;
            margin-bottom: 8px;
        }

        .modal-subtitle {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .modal-subtitle strong {
            color: #fff;
            font-weight: 600;
        }

        /* ===== MODAL FORM ELEMENTS ===== */
        .modal-email-input-group {
            width: 100%;
        }

        .modal-email-input-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 12px;
        }

        .modal-email-input-wrapper .fa-envelope {
            position: absolute;
            left: 14px;
            top: 50%;
            margin-top: -8px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 16px;
        }

        .modal-email-input {
            width: 100%;
            padding: 14px 14px 14px 44px;
            border: 2px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            -webkit-transition: border-color 0.3s ease;
            transition: border-color 0.3s ease;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            -webkit-box-sizing: border-box;
            box-sizing: border-box;
        }

        .modal-email-input:focus {
            border-color: #6d4fc6;
        }

        .modal-email-input.error {
            border-color: #dc3545;
        }

        .modal-email-input.success {
            border-color: #28a745;
        }

        /* ===== MODAL BUTTONS ===== */
        .modal-btn-primary {
            width: 100%;
            padding: 16px 20px;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            -webkit-transition: all 0.3s ease;
            transition: all 0.3s ease;
            color: #fff;
            background: #2d1b69;
            background: -webkit-linear-gradient(315deg, #2d1b69, #6d4fc6);
            background: linear-gradient(135deg, #2d1b69, #6d4fc6);
            box-shadow: 0 8px 30px rgba(45, 27, 105, 0.4);
            -webkit-tap-highlight-color: transparent;
            -ms-touch-action: manipulation;
            touch-action: manipulation;
            min-height: 54px;
            -webkit-appearance: none;
            appearance: none;
        }

        .modal-btn-primary i {
            margin-right: 10px;
        }

        .modal-btn-primary:active {
            -webkit-transform: scale(0.97);
            transform: scale(0.97);
        }

        .modal-btn-primary:disabled {
            opacity: 0.6;
            cursor: default;
        }

        .modal-btn-secondary {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            font-weight: 400;
            cursor: pointer;
            padding: 8px 12px;
            -webkit-transition: color 0.3s ease;
            transition: color 0.3s ease;
            font-family: 'Inter', sans-serif;
            margin-top: 8px;
            -webkit-tap-highlight-color: transparent;
            -ms-touch-action: manipulation;
            touch-action: manipulation;
            -webkit-appearance: none;
            appearance: none;
        }

        /* ===== MODAL STATUS MESSAGES ===== */
        .modal-status-msg {
            font-size: 14px;
            padding: 6px 10px;
            border-radius: 10px;
            min-height: 20px;
            -webkit-transition: all 0.3s ease;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        .modal-status-msg.success { color: #7ddfa0; }
        .modal-status-msg.error { color: #f8717a; }
        .modal-status-msg.info { color: #93c5fd; }
        .modal-status-msg.loading { color: rgba(255, 255, 255, 0.6); }

        /* ===== QR CODE MODAL ===== */
        .qr-container {
            background: #ffffff;
            border-radius: 16px;
            padding: 20px;
            margin: 0 auto 20px;
            display: inline-block;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .qr-image {
            display: block;
            width: 260px;
            height: 260px;
            max-width: 100%;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }

        .qr-instruction {
            font-size: 16px;
            color: #fff;
            font-weight: 600;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .qr-instruction-sub {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .qr-icon {
            font-size: 42px;
            margin-bottom: 14px;
            color: #1a73e8;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .slide-btn {
                padding: 24px 50px;
                font-size: 24px;
                border-radius: 50px;
            }
            .slide-btn i { font-size: 26px; }
            .slide .slide-content { margin-bottom: 22vh; }
            .modal-container {
                padding: 32px 20px 28px;
                border-radius: 24px;
                max-width: 400px;
            }
            .dots { bottom: 28px; }
            .dot { width: 8px; height: 8px; margin: 0 5px; }
            .dot.active { width: 24px; }
            .brand-watermark { bottom: 60px; font-size: 10px; }
            .modal-title { font-size: 24px; }
            .qr-image { width: 220px; height: 220px; }
        }

        @media (max-width: 480px) {
            .slide-btn {
                padding: 18px 36px;
                font-size: 18px;
                border-radius: 40px;
            }
            .slide-btn i { font-size: 20px; margin-right: 12px; }
            .slide .slide-content { margin-bottom: 20vh; }
            .modal-container {
                padding: 24px 16px 20px;
                border-radius: 20px;
                max-width: 100%;
            }
            .dots { bottom: 20px; }
            .dot { width: 6px; height: 6px; margin: 0 4px; }
            .dot.active { width: 20px; }
            .brand-watermark { bottom: 48px; font-size: 9px; }
            .modal-title { font-size: 22px; }
            .modal-subtitle { font-size: 14px; }
            .modal-btn-primary {
                font-size: 15px;
                padding: 12px 16px;
                min-height: 46px;
                border-radius: 12px;
            }
            .modal-email-input {
                font-size: 15px;
                padding: 12px 12px 12px 40px;
                border-radius: 12px;
            }
            .qr-image { width: 200px; height: 200px; }
            .qr-container { padding: 16px; }
            .qr-instruction { font-size: 15px; }
        }
    </style>
</head>
<body>

    <div class="engagement-wrapper" id="engagementWrapper">

        <!-- Slides Container -->
        <div class="slides-container" id="slidesContainer">
            <!-- SLIDE 1: Google Review -->
            <div class="slide" data-slide="review">
                <div class="slide-pig"></div>
                <div class="slide-overlay"></div>
                <div class="slide-content">
                    <button class="slide-btn review-btn" id="reviewDirectBtn" type="button">
                        <i class="fab fa-google"></i><span>Write a Review</span>
                    </button>
                </div>
            </div>

            <!-- SLIDE 2: Email Newsletter -->
            <div class="slide" data-slide="email">
                <div class="slide-pig"></div>
                <div class="slide-overlay"></div>
                <div class="slide-content">
                    <button class="slide-btn email-btn" id="emailOpenBtn" type="button">
                        <i class="fas fa-paper-plane"></i><span>Subscribe</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Dot Indicators -->
        <div class="dots" id="dotsContainer">
            <span class="dot active" data-slide="0"></span>
            <span class="dot" data-slide="1"></span>
        </div>

        <!-- Brand Watermark -->
        <div class="brand-watermark">PigStyle Music</div>

        <!-- ===== MODAL OVERLAY (Email) ===== -->
        <div class="modal-overlay" id="modalOverlay">
            <div class="modal-container" id="modalContainer">

                <!-- Close Button -->
                <button class="modal-close" id="closeModalBtn" type="button">
                    <i class="fas fa-times"></i>
                </button>

                <!-- Modal Content -->
                <div id="modalContent">
                    <div style="text-align: center;">
                        <div style="font-size: 48px; margin-bottom: 12px;">
                            <i class="fas fa-envelope-open-text"></i>
                        </div>
                        <h2 class="modal-title">Join Our Email List</h2>
                        <p class="modal-subtitle">
                            Stay updated on <strong>new arrivals, events,</strong> and <strong>special offers</strong>.<br />
                            No spam, unsubscribe anytime.
                        </p>
                        <div class="modal-email-input-group">
                            <div class="modal-email-input-wrapper">
                                <i class="fas fa-envelope"></i>
                                <input type="email" class="modal-email-input" id="modalEmailInput"
                                       placeholder="Enter your email" autocomplete="email" />
                            </div>
                            <button class="modal-btn-primary" id="modalSubscribeBtn" type="button">
                                <i class="fas fa-paper-plane"></i> Subscribe
                            </button>
                            <div id="modalEmailStatus" class="modal-status-msg"></div>
                        </div>
                        <button class="modal-btn-secondary" id="modalSkipEmailBtn" type="button">No thanks, maybe later</button>
                    </div>
                </div>

            </div>
        </div>

        <!-- ===== QR CODE MODAL (Review) ===== -->
        <div class="modal-overlay" id="qrModalOverlay">
            <div class="modal-container">
                <button class="modal-close" id="closeQrModalBtn" type="button">
                    <i class="fas fa-times"></i>
                </button>

                <div style="text-align: center;">
                    <div class="qr-icon">
                        <i class="fab fa-google"></i>
                    </div>
                    <h2 class="modal-title">Leave Us a Review</h2>
                    <p class="qr-instruction">Scan this code with your phone's camera</p>
                    <p class="qr-instruction-sub">Points to our Google review page. Takes about 30 seconds.</p>

                    <div class="qr-container">
                        <img src="/images/qr-code-review.png" alt="Scan to leave a Google review" class="qr-image" id="qrImage" />
                    </div>

                    <p class="qr-instruction-sub" style="margin-bottom: 8px;">Or visit:</p>
                    <p style="font-size: 15px; font-weight: 700; color: #fff; letter-spacing: 0.5px; margin-bottom: 20px;">
                        pigstylemusic.com/review
                    </p>

                    <button class="modal-btn-secondary" id="qrCloseBtn" type="button">Close</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // ES5-compatible script. No const/let, no arrow functions,
        // no template literals, no async/await, no fetch().
        // Uses XMLHttpRequest for network calls.
        (function() {
            'use strict';

            // ===== CONFIG =====
            var API_BASE = (window.location.hostname === 'localhost' ||
                            window.location.hostname === '127.0.0.1')
                            ? 'http://localhost:5000'
                            : 'https://www.pigstylemusic.com';

            var SLIDE_INTERVAL = 6000;

            // ===== DOM REFS =====
            var slidesContainer = document.getElementById('slidesContainer');
            var dots = document.querySelectorAll('.dot');
            var reviewDirectBtn = document.getElementById('reviewDirectBtn');
            var emailOpenBtn = document.getElementById('emailOpenBtn');
            var modalOverlay = document.getElementById('modalOverlay');
            var closeModalBtn = document.getElementById('closeModalBtn');
            var modalEmailInput = document.getElementById('modalEmailInput');
            var modalEmailStatus = document.getElementById('modalEmailStatus');
            var modalSubscribeBtn = document.getElementById('modalSubscribeBtn');
            var modalSkipEmailBtn = document.getElementById('modalSkipEmailBtn');

            var qrModalOverlay = document.getElementById('qrModalOverlay');
            var closeQrModalBtn = document.getElementById('closeQrModalBtn');
            var qrCloseBtn = document.getElementById('qrCloseBtn');

            var currentSlide = 0;
            var autoSlideTimer = null;
            var isTransitioning = false;

            // ===== DOM HELPERS (for old browsers) =====
            function hasClass(el, cls) {
                if (el.classList && el.classList.contains) {
                    return el.classList.contains(cls);
                }
                return (' ' + el.className + ' ').indexOf(' ' + cls + ' ') > -1;
            }

            function addClass(el, cls) {
                if (el.classList && el.classList.add) {
                    el.classList.add(cls);
                } else if (!hasClass(el, cls)) {
                    el.className = (el.className ? el.className + ' ' : '') + cls;
                }
            }

            function removeClass(el, cls) {
                if (el.classList && el.classList.remove) {
                    el.classList.remove(cls);
                } else {
                    el.className = (' ' + el.className + ' ')
                        .replace(' ' + cls + ' ', ' ')
                        .replace(/^\s+|\s+$/g, '');
                }
            }

            function toggleClass(el, cls, on) {
                if (on) { addClass(el, cls); } else { removeClass(el, cls); }
            }

            function addListener(el, type, fn) {
                if (!el) return;
                if (el.addEventListener) {
                    el.addEventListener(type, fn, false);
                } else if (el.attachEvent) {
                    el.attachEvent('on' + type, fn);
                }
            }

            // ===== GO TO SLIDE =====
            function goToSlide(index) {
                if (isTransitioning || index === currentSlide) return;
                isTransitioning = true;

                currentSlide = index;
                slidesContainer.style.transform = 'translateX(-' + (index * 100) + '%)';
                slidesContainer.style.webkitTransform = 'translateX(-' + (index * 100) + '%)';

                for (var i = 0; i < dots.length; i++) {
                    toggleClass(dots[i], 'active', i === index);
                }

                resetAutoSlide();

                setTimeout(function() {
                    isTransitioning = false;
                }, 700);
            }

            // ===== RESET AUTO SLIDE =====
            function resetAutoSlide() {
                if (autoSlideTimer) {
                    clearInterval(autoSlideTimer);
                    autoSlideTimer = null;
                }
                autoSlideTimer = setInterval(function() {
                    var next = (currentSlide + 1) % 2;
                    goToSlide(next);
                }, SLIDE_INTERVAL);
            }

            // ===== PAUSE AUTO SLIDE (when modal open) =====
            function pauseAutoSlide() {
                if (autoSlideTimer) {
                    clearInterval(autoSlideTimer);
                    autoSlideTimer = null;
                }
            }

            // ===== DOT CLICKS =====
            for (var d = 0; d < dots.length; d++) {
                (function(index) {
                    addListener(dots[index], 'click', function(e) {
                        if (e.stopPropagation) e.stopPropagation();
                        goToSlide(index);
                    });
                })(d);
            }

            // ===== REVIEW BUTTON - OPEN QR MODAL =====
            addListener(reviewDirectBtn, 'click', function(e) {
                if (e && e.preventDefault) e.preventDefault();
                openQrModal();
            });

            // ===== EMAIL BUTTON - OPEN MODAL =====
            addListener(emailOpenBtn, 'click', function(e) {
                if (e && e.preventDefault) e.preventDefault();
                openModal();
            });

            // ===== QR MODAL =====
            function openQrModal() {
                addClass(qrModalOverlay, 'active');
                document.body.style.overflow = 'hidden';
                pauseAutoSlide();
            }

            function closeQrModal() {
                removeClass(qrModalOverlay, 'active');
                document.body.style.overflow = '';
                resetAutoSlide();
            }

            addListener(closeQrModalBtn, 'click', closeQrModal);
            addListener(qrCloseBtn, 'click', closeQrModal);
            addListener(qrModalOverlay, 'click', function(e) {
                if (e.target === qrModalOverlay) {
                    closeQrModal();
                }
            });

            // ===== EMAIL MODAL =====
            function openModal() {
                addClass(modalOverlay, 'active');
                document.body.style.overflow = 'hidden';
                pauseAutoSlide();
                setTimeout(function() {
                    try { modalEmailInput.focus(); } catch (e) {}
                }, 300);
            }

            function closeModal() {
                removeClass(modalOverlay, 'active');
                document.body.style.overflow = '';
                resetAutoSlide();
                removeClass(modalEmailInput, 'error');
                removeClass(modalEmailInput, 'success');
                modalEmailStatus.textContent = '';
                modalEmailStatus.className = 'modal-status-msg';
                modalSubscribeBtn.disabled = false;
                modalSubscribeBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Subscribe';
            }

            addListener(closeModalBtn, 'click', closeModal);
            addListener(modalOverlay, 'click', function(e) {
                if (e.target === modalOverlay) {
                    closeModal();
                }
            });

            // ===== ESC TO CLOSE ANY MODAL =====
            addListener(document, 'keydown', function(e) {
                if (e.key === 'Escape') {
                    if (hasClass(modalOverlay, 'active')) closeModal();
                    if (hasClass(qrModalOverlay, 'active')) closeQrModal();
                }
            });

            // ===== MODAL SKIP =====
            addListener(modalSkipEmailBtn, 'click', function(e) {
                if (e && e.preventDefault) e.preventDefault();
                closeModal();
            });

            // ===== XHR HELPER (no fetch) =====
            function postJSON(url, body, onSuccess, onError) {
                var xhr = new XMLHttpRequest();
                xhr.open('POST', url, true);
                xhr.setRequestHeader('Content-Type', 'application/json');
                xhr.onreadystatechange = function() {
                    if (xhr.readyState !== 4) return;
                    if (xhr.status >= 200 && xhr.status < 300) {
                        var data;
                        try {
                            data = JSON.parse(xhr.responseText);
                        } catch (e) {
                            onError(new Error('Invalid JSON response'));
                            return;
                        }
                        onSuccess(data);
                    } else {
                        var err = new Error('HTTP ' + xhr.status);
                        err.status = xhr.status;
                        onError(err);
                    }
                };
                xhr.onerror = function() {
                    onError(new Error('Network error'));
                };
                try {
                    xhr.send(JSON.stringify(body));
                } catch (e) {
                    onError(e);
                }
            }

            // ===== MODAL EMAIL SUBSCRIPTION =====
            function modalSubscribeEmail() {
                var email = modalEmailInput.value.replace(/^\s+|\s+$/g, '');
                modalEmailStatus.className = 'modal-status-msg';

                if (!email) {
                    modalEmailStatus.textContent = '⚠️ Please enter your email';
                    modalEmailStatus.className = 'modal-status-msg error';
                    addClass(modalEmailInput, 'error');
                    return;
                }
                if (email.indexOf('@') === -1 || email.indexOf('.') === -1) {
                    modalEmailStatus.textContent = '⚠️ Please enter a valid email';
                    modalEmailStatus.className = 'modal-status-msg error';
                    addClass(modalEmailInput, 'error');
                    return;
                }

                removeClass(modalEmailInput, 'error');
                modalEmailStatus.textContent = '⏳ Subscribing...';
                modalEmailStatus.className = 'modal-status-msg loading';
                modalSubscribeBtn.disabled = true;
                modalSubscribeBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Subscribing...';

                postJSON(
                    API_BASE + '/api/email-list/subscribe',
                    { email: email },
                    function(data) {
                        if (data.status === 'success') {
                            if (data.already_subscribed) {
                                modalEmailStatus.textContent = '📧 You\'re already subscribed!';
                                modalEmailStatus.className = 'modal-status-msg info';
                                addClass(modalEmailInput, 'success');
                            } else {
                                modalEmailStatus.textContent = '✅ Subscribed! Check your email for updates.';
                                modalEmailStatus.className = 'modal-status-msg success';
                                modalEmailInput.value = '';
                                addClass(modalEmailInput, 'success');
                                setTimeout(closeModal, 2000);
                            }
                        } else {
                            modalEmailStatus.textContent = '❌ ' + (data.error || 'Failed to subscribe');
                            modalEmailStatus.className = 'modal-status-msg error';
                            addClass(modalEmailInput, 'error');
                        }
                        modalSubscribeBtn.disabled = false;
                        modalSubscribeBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Subscribe';
                    },
                    function(err) {
                        if (err.status === 404) {
                            modalEmailStatus.textContent = '❌ Server endpoint not found. Please try again later.';
                        } else {
                            modalEmailStatus.textContent = '❌ Network error. Please try again.';
                        }
                        modalEmailStatus.className = 'modal-status-msg error';
                        addClass(modalEmailInput, 'error');
                        modalSubscribeBtn.disabled = false;
                        modalSubscribeBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Subscribe';
                    }
                );
            }

            addListener(modalSubscribeBtn, 'click', function(e) {
                if (e && e.preventDefault) e.preventDefault();
                modalSubscribeEmail();
            });

            addListener(modalEmailInput, 'keydown', function(e) {
                if (e.key === 'Enter' || e.keyCode === 13) {
                    if (e.preventDefault) e.preventDefault();
                    modalSubscribeEmail();
                }
            });

            addListener(modalEmailInput, 'input', function() {
                removeClass(this, 'error');
                removeClass(this, 'success');
                var txt = modalEmailStatus.textContent || '';
                if (txt && txt.indexOf('✅') === -1 && txt.indexOf('📧') === -1) {
                    modalEmailStatus.textContent = '';
                    modalEmailStatus.className = 'modal-status-msg';
                }
            });

            // ===== TOUCH SWIPE SUPPORT =====
            var touchStartX = 0;
            var touchEndX = 0;
            var touchStartY = 0;
            var touchEndY = 0;

            addListener(document, 'touchstart', function(e) {
                touchStartX = e.changedTouches[0].screenX;
                touchStartY = e.changedTouches[0].screenY;
            });

            addListener(document, 'touchend', function(e) {
                // Don't swipe if a modal is open
                if (hasClass(modalOverlay, 'active') || hasClass(qrModalOverlay, 'active')) {
                    return;
                }
                touchEndX = e.changedTouches[0].screenX;
                touchEndY = e.changedTouches[0].screenY;
                var dx = touchEndX - touchStartX;
                var dy = touchEndY - touchStartY;
                if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
                    if (e.preventDefault) e.preventDefault();
                    if (dx < 0 && currentSlide === 0) {
                        goToSlide(1);
                    } else if (dx > 0 && currentSlide === 1) {
                        goToSlide(0);
                    }
                }
            });

            // ===== VIEWPORT HEIGHT FIX (for old mobile browsers) =====
            function fixViewportHeight() {
                var wrap = document.getElementById('engagementWrapper');
                if (wrap) {
                    wrap.style.height = window.innerHeight + 'px';
                }
            }
            addListener(window, 'resize', fixViewportHeight);
            addListener(window, 'orientationchange', function() {
                setTimeout(fixViewportHeight, 200);
            });
            fixViewportHeight();

            // ===== START =====
            resetAutoSlide();

            console.log('📧 Email list API base:', API_BASE);
            console.log('⭐ Review button opens QR modal');

        })();
    </script>

</body>
</html>
